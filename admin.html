<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Scorecard Admin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .navbar { background: white; padding: 20px 30px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .navbar h1 { font-size: 24px; color: #333; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link { padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; background: #f0f0f0; color: #333; transition: all 0.3s; }
        .nav-link:hover, .nav-link.active { background: #667eea; color: white; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 10px; font-size: 22px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .upload-box { border: 2px dashed #667eea; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; background: #f8f9ff; transition: all 0.3s; }
        .upload-box:hover { border-color: #764ba2; background: #f0f2ff; }
        .upload-box input { display: none; }
        .upload-box p { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 10px; }
        .upload-box small { color: #999; }
        .file-list { background: #f8f9ff; border-radius: 8px; padding: 20px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: white; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #667eea; }
        .file-name { font-weight: 600; color: #333; }
        .file-size { color: #999; font-size: 12px; }
        .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .alert { padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert-success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .alert-error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .alert-info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; }
        .progress-section { display: none; }
        .progress-section.show { display: block; }
        .progress-item { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #333; }
        .progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); width: 0%; transition: width 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 12px; opacity: 0.9; text-transform: uppercase; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: bold; }
        #resultsCard { display: none; }
        @media (max-width: 768px) { .upload-grid { grid-template-columns: 1fr; } .stats-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>📊 HR Scorecard Admin</h1>
        <div class="nav-links">
            <a href="#" class="nav-link active">Admin</a>
            <a href="manager.html" class="nav-link">Dashboard</a>
        </div>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>Upload Excel Files</h2>
            <p class="subtitle">Select your Excel files or entire folder</p>
            <div id="alertContainer"></div>
            
            <div class="upload-grid">
                <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                    <p>📄 Individual Files</p>
                    <small>Select specific Excel files</small>
                    <input type="file" id="fileInput" multiple accept=".xlsx,.xls" onchange="handleFileSelect(event)">
                </div>
                <div class="upload-box" onclick="document.getElementById('folderInput').click()">
                    <p>📁 Entire Folder</p>
                    <small>Select folder with all files</small>
                    <input type="file" id="folderInput" webkitdirectory directory multiple onchange="handleFolderSelect(event)">
                </div>
            </div>
            
            <div id="fileListContainer" style="display: none;">
                <h3 style="margin-bottom: 15px; color: #333; font-size: 14px; text-transform: uppercase;">Selected Files</h3>
                <div id="fileList" class="file-list"></div>
            </div>
            
            <div class="buttons">
                <button class="btn-primary" id="processBtn" onclick="processFiles()" disabled>⚙️ Process Files</button>
                <button class="btn-secondary" onclick="clearFiles()">🗑️ Clear</button>
            </div>
        </div>
        
        <div class="card progress-section" id="progressSection">
            <h2>Processing Progress</h2>
            <div class="progress-item">
                <div class="progress-label"><span>Overall</span><span id="progressPercent">0%</span></div>
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            </div>
        </div>
        
        <div class="card" id="resultsCard">
            <h2>✅ Complete</h2>
            <div class="stats-grid" id="statsGrid"></div>
            <div class="buttons" style="margin-top: 30px;">
                <button class="btn-primary" onclick="window.location.href='manager.html'">👀 View Dashboard</button>
            </div>
        </div>
    </div>

    <script>
        // ===== TEAM-WISE KPI ENGINE =====
        class TeamKPIEngine {
            constructor() {
                this.employees = {};
                this.teams = {};
                this.excelData = {};
            }

            getEmployeeRoster() {
                return {
                    'P11561': { name: 'Sayee Nivas B', team: 'Compliance' },
                    'P12976': { name: 'Alan Benjamin', team: 'Compliance' },
                    'P13001': { name: 'Pavithra M', team: 'Compliance' },
                    'P13005': { name: 'Latha J', team: 'Compliance' },
                    'P13082': { name: 'Sneha Thomas', team: 'Compliance' },
                    'P13315': { name: 'Azhar Taj', team: 'Compliance' },
                    'P13318': { name: 'Rathina Sudhan K', team: 'Compliance' },
                    'P11279': { name: 'Archana Gautam', team: 'Final Clearance' },
                    'P11436': { name: 'Aswani R', team: 'Final Clearance' },
                    'P12210': { name: 'Anubha Priyam', team: 'Final Clearance' },
                    'P11969': { name: 'Arjun MP', team: 'HR Operations' },
                    'P13086': { name: 'Ingrid Mary Pope', team: 'HR Operations' },
                    'P13310': { name: 'M Rihana', team: 'HR Operations' },
                    'P11184': { name: 'Ramesh Kumar Selvaraj', team: 'HR Operations' },
                    'P11156': { name: 'Yogeshwaran R', team: 'Internal Audit' },
                    'P11569': { name: 'Banupriya B', team: 'Internal Audit' },
                    'P11470': { name: 'Leonie Gomes', team: 'Paperwork Clearance' },
                    'P12527': { name: 'Thirisha Manoharan', team: 'Paperwork Clearance' },
                    'P12945': { name: 'Vinish Navinkumar', team: 'Paperwork Clearance' }
                };
            }

            // Parse Excel files
            async processExcelFiles(fileList) {
                for (const file of fileList) {
                    try {
                        const arrayBuffer = await this.readFile(file);
                        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                        this.parseFile(workbook, file.name);
                    } catch (e) {
                        console.log(`File ${file.name}: ${e.message}`);
                    }
                }

                // Initialize all employees with team-specific KPIs
                this.initializeEmployees();
                
                // Extract KPIs from parsed data
                this.extractKPIs();
                
                // Calculate team-specific scores
                this.calculateTeamScores();
                
                return { success: true };
            }

            readFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(file);
                });
            }

            parseSheetToJson(sheet) {
                if (!sheet) return [];
                // Get all rows with proper handling of datetime headers
                const rows = [];
                let headers = [];

                for (let row = sheet['!ref'].split(':')[0].charCodeAt(0) - 65, col = 1; col <= sheet['!ref'].split('!')[1].split(':')[1].charCodeAt(0) - 64; col++) {
                    const cell = sheet[XLSX.utils.encode_cell({r: 0, c: col - 1})];
                    headers.push(cell ? cell.v : `Col${col}`);
                }

                // Simpler approach - just use sheet_to_json but handle the result
                const data = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                return data;
            }

            parseFile(workbook, fileName) {
                if (fileName.includes('Attendance')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.attendance = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Production')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.production = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Process_Knowledge') || fileName.includes('Process Knowledge')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.pkt = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('NH_pending') || fileName.includes('NH pending')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.nhPending = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Client_System_Audit') || fileName.includes('Client System Audit')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.clientAudit = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Internal_Audit_Scores') || fileName.includes('Internal Audit Scores')) {
                    const sheetName = workbook.SheetNames.find(s => s === 'Internal Audit') || workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    this.excelData.internalAudit = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Data Changes') || fileName.includes('Data_Changes')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.dataChanges = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Tenure Discount') || fileName.includes('Tenure_Discount')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.tenureDiscount = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Termination')) {
                    const sheetName = workbook.SheetNames.find(s => s.includes('RTA')) || workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    this.excelData.termination = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Final Clearance') || fileName.includes('Final_Clearance')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.finalClearance = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Internal Audit Master') || fileName.includes('Internal_Audit_Master')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.internalAuditMaster = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Internal Audit Tracker') || fileName.includes('Internal_Audit_Tracker')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.internalAuditTracker = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('QMG Error') || fileName.includes('QMG_Error')) {
                    const sheetName = workbook.SheetNames.find(s => s.includes('NCA')) || workbook.SheetNames[1];
                    const sheet = workbook.Sheets[sheetName];
                    this.excelData.qmgErrors = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Paperwork Allocation') || fileName.includes('Paperwork_Allocation')) {
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    this.excelData.paperworkAllocation = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Paperwork Clearance') || fileName.includes('Paperwork_Clearance')) {
                    const sheetName = workbook.SheetNames.find(s => s.includes('Clearance Tracker')) || workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    this.excelData.paperworkClearance = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                }
                else if (fileName.includes('Incentive')) {
                    // Load Roles sheet for incentive role mapping
                    const rolesSheet = workbook.Sheets['Roles'];
                    if (rolesSheet) {
                        this.excelData.roles = XLSX.utils.sheet_to_json(rolesSheet, { defval: '' });
                    }
                }
            }

            initializeEmployees() {
                const roster = this.getEmployeeRoster();
                const teams = {
                    'HR Operations': [],
                    'Compliance': [],
                    'Final Clearance': [],
                    'Internal Audit': [],
                    'Paperwork Clearance': []
                };

                Object.entries(roster).forEach(([empId, info]) => {
                    // Get role from Excel Roles sheet if available
                    let role = 'Auditor'; // default
                    if (this.excelData.roles) {
                        const roleRow = this.excelData.roles.find(r => {
                            const idCol = Object.keys(r)[0];
                            return r[idCol] && r[idCol].toString().includes(empId);
                        });
                        if (roleRow) {
                            const roleCol = roleRow['Role'] || Object.values(roleRow)[Object.keys(roleRow).length - 1];
                            role = roleCol || 'Auditor';
                        }
                    }

                    const emp = {
                        id: empId,
                        name: info.name,
                        team: info.team,
                        role: role,
                        kpis: {},
                        scores: {},
                        status: 'Red',
                        eligibility: 'Eligible'
                    };
                    this.employees[empId] = emp;
                    teams[info.team].push(empId);
                });

                this.teams = teams;
            }

            extractKPIs() {
                Object.entries(this.employees).forEach(([empId, emp]) => {
                    const team = emp.team;

                    // COMMON KPIs (All Teams)
                    emp.kpis.productivity = this.getProductivity(emp.name);
                    emp.kpis.productivityStatus = emp.kpis.productivity === null ? 'Blue' : emp.kpis.productivity >= 8 ? 'Green' : 'Red';

                    emp.kpis.pkt = this.getPKT(emp.name);
                    emp.kpis.pktStatus = emp.kpis.pkt === null ? 'Blue' : emp.kpis.pkt >= 90 ? 'Green' : emp.kpis.pkt >= 80 ? 'Amber' : 'Red';

                    emp.kpis.attendance = this.getAttendance(emp.name);
                    emp.kpis.attendanceStatus = emp.kpis.attendance === null ? 'Blue' : emp.kpis.attendance >= 90 ? 'Green' : emp.kpis.attendance >= 75 ? 'Amber' : 'Red';

                    emp.kpis.clientPending = this.getClientPending(emp.name);
                    emp.kpis.nhPending = this.getNHPending(emp.name);

                    // TEAM-SPECIFIC KPIs
                    if (team === 'HR Operations') {
                        emp.kpis.dataChanges = this.getDataChanges(emp.name);
                        emp.kpis.terminationStatus = this.getTerminationStatus(emp.name);
                        emp.kpis.tenureDiscount = this.getTenureDiscount(emp.name);
                    }
                    else if (team === 'Compliance') {
                        emp.kpis.internalAuditErrors = this.getInternalAuditErrors(emp.name);
                        emp.kpis.auditStatus = emp.kpis.internalAuditErrors === null ? 'Blue' : emp.kpis.internalAuditErrors === 0 ? 'Green' : emp.kpis.internalAuditErrors <= 3 ? 'Amber' : 'Red';
                    }
                    else if (team === 'Final Clearance') {
                        emp.kpis.internalAuditErrors = this.getInternalAuditErrors(emp.name);
                        emp.kpis.auditStatus = emp.kpis.internalAuditErrors === null ? 'Blue' : emp.kpis.internalAuditErrors === 0 ? 'Green' : emp.kpis.internalAuditErrors <= 3 ? 'Amber' : 'Red';
                        emp.kpis.clearanceSLA = this.getClearanceSLA(emp.name);
                        emp.kpis.clearanceCount = this.getClearanceCount(emp.name);
                        emp.kpis.slaStatus = emp.kpis.clearanceSLA === null ? 'Blue' : emp.kpis.clearanceSLA <= 2 ? 'Green' : 'Red';
                    }
                    else if (team === 'Internal Audit') {
                        emp.kpis.nhPending = this.getNHPending(emp.name);
                        emp.kpis.qmgTimeline = this.getQMGTimeline(emp.name);
                        emp.kpis.timelineStatus = emp.kpis.qmgTimeline === null ? 'Blue' : emp.kpis.qmgTimeline <= 8 ? 'Green' : 'Red';
                        emp.kpis.qmgNCAErrors = this.getQMGErrors(emp.name);
                        emp.kpis.qmgCAErrors = 0;
                        emp.kpis.auditCompletion = this.getAuditCompletion(emp.name);
                    }
                    else if (team === 'Paperwork Audit' || team === 'Paperwork Clearance') {
                        emp.kpis.nhPending = this.getNHPending(emp.name);
                        emp.kpis.internalAuditErrors = this.getInternalAuditErrors(emp.name);
                        emp.kpis.auditStatus = emp.kpis.internalAuditErrors === null ? 'Blue' : emp.kpis.internalAuditErrors === 0 ? 'Green' : emp.kpis.internalAuditErrors <= 3 ? 'Amber' : 'Red';
                        emp.kpis.paperworkSLA = this.getPaperworkSLA(emp.name);
                        emp.kpis.slaStatus = emp.kpis.paperworkSLA === null ? 'Blue' : emp.kpis.paperworkSLA <= 3 ? 'Green' : 'Red';
                        emp.kpis.allocationCompletion = this.getAllocationCompletion(emp.name);
                    }
                });
            }

            calculateTeamScores() {
                Object.entries(this.employees).forEach(([empId, emp]) => {
                    const team = emp.team;
                    let score = 0;

                    // TEAM-SPECIFIC SCORING FORMULAS
                    if (team === 'HR Operations') {
                        score = (emp.kpis.productivity !== null && emp.kpis.productivity >= 8 ? 20 : 0) +
                                (emp.kpis.pkt !== null && emp.kpis.pkt >= 90 ? 25 : emp.kpis.pkt !== null && emp.kpis.pkt >= 80 ? 20 : 15) +
                                (emp.kpis.attendance !== null && emp.kpis.attendance >= 90 ? 25 : emp.kpis.attendance !== null && emp.kpis.attendance >= 75 ? 20 : 15) +
                                (emp.kpis.dataChanges !== null && emp.kpis.dataChanges >= 1 ? 15 : 0) +
                                (emp.kpis.clientPending === null || emp.kpis.clientPending === 0 ? 15 : 0);
                    }
                    else if (team === 'Compliance') {
                        score = (emp.kpis.productivity !== null && emp.kpis.productivity >= 8 ? 20 : 0) +
                                (emp.kpis.pkt !== null && emp.kpis.pkt >= 90 ? 30 : emp.kpis.pkt !== null && emp.kpis.pkt >= 80 ? 20 : 10) +
                                (emp.kpis.internalAuditErrors !== null && emp.kpis.internalAuditErrors === 0 ? 30 : emp.kpis.internalAuditErrors !== null && emp.kpis.internalAuditErrors <= 3 ? 20 : 10) +
                                (emp.kpis.attendance !== null && emp.kpis.attendance >= 90 ? 20 : 0);
                    }
                    else if (team === 'Final Clearance') {
                        score = (emp.kpis.productivity !== null && emp.kpis.productivity >= 8 ? 15 : 0) +
                                (emp.kpis.pkt !== null && emp.kpis.pkt >= 90 ? 20 : 10) +
                                (emp.kpis.clearanceSLA !== null && emp.kpis.clearanceSLA <= 2 ? 30 : 15) +
                                (emp.kpis.internalAuditErrors !== null && emp.kpis.internalAuditErrors === 0 ? 20 : 10) +
                                (emp.kpis.attendance !== null && emp.kpis.attendance >= 90 ? 15 : 0);
                    }
                    else if (team === 'Internal Audit') {
                        score = (emp.kpis.productivity !== null && emp.kpis.productivity >= 8 ? 15 : 0) +
                                (emp.kpis.pkt !== null && emp.kpis.pkt >= 90 ? 20 : 10) +
                                (emp.kpis.qmgTimeline !== null && emp.kpis.qmgTimeline <= 8 ? 25 : 15) +
                                ((emp.kpis.qmgNCAErrors !== null ? emp.kpis.qmgNCAErrors : 0) + (emp.kpis.qmgCAErrors || 0) === 0 ? 25 : 15) +
                                (emp.kpis.attendance !== null && emp.kpis.attendance >= 90 ? 15 : 0);
                    }
                    else if (team === 'Paperwork Audit' || team === 'Paperwork Clearance') {
                        score = (emp.kpis.productivity !== null && emp.kpis.productivity >= 8 ? 15 : 0) +
                                (emp.kpis.pkt !== null && emp.kpis.pkt >= 90 ? 20 : 10) +
                                (emp.kpis.paperworkSLA !== null && emp.kpis.paperworkSLA <= 3 ? 30 : 15) +
                                (emp.kpis.allocationCompletion !== null && emp.kpis.allocationCompletion >= 0.9 ? 20 : 10) +
                                (emp.kpis.attendance !== null && emp.kpis.attendance >= 90 ? 15 : 0);
                    }

                    emp.scores.teamScore = score;

                    if (score >= 90) emp.status = 'Green';
                    else if (score >= 80) emp.status = 'Amber';
                    else emp.status = 'Red';

                    // ELIGIBILITY CHECK - Team-specific logic
                    let isEligible = true;

                    // All teams except Final Clearance check NH Pending
                    if (team !== 'Final Clearance') {
                        const nhCount = emp.kpis.nhPending === null ? 0 : emp.kpis.nhPending;
                        if (nhCount > 0) isEligible = false;
                    }

                    // All teams check Client System Audit
                    const clientCount = emp.kpis.clientPending === null ? 0 : emp.kpis.clientPending;
                    if (clientCount > 0) isEligible = false;

                    emp.eligibility = isEligible ? 'Eligible' : 'Not Eligible';
                });
            }

            // Helper functions to extract KPIs from Excel data
            findEmployeeRow(data, name) {
                if (!data || !Array.isArray(data)) return null;
                const cleanName = name.trim().toLowerCase();
                return data.find(r => {
                    // Check first column (usually "Team Member")
                    const firstCol = Object.values(r)[0];
                    if (firstCol) {
                        const colStr = firstCol.toString().trim().toLowerCase();
                        if (colStr.includes(cleanName) || cleanName.includes(colStr.split(' ')[0])) {
                            return true;
                        }
                    }
                    return false;
                });
            }

            getAverageFromMonthColumns(row) {
                if (!row) return null;
                // Skip first column (Team Member name) and get all numeric values
                const values = Object.values(row).slice(1).filter(v => {
                    // Accept numbers, and filter out zero/negative/non-numeric
                    return typeof v === 'number' && v > 0;
                });
                if (values.length === 0) return null;
                return values.reduce((a, b) => a + b, 0) / values.length;
            }

            getProductivity(name) {
                if (!this.excelData.production) return null;
                const row = this.findEmployeeRow(this.excelData.production, name);
                if (row) {
                    const avg = this.getAverageFromMonthColumns(row);
                    return avg > 0 ? avg : null;
                }
                return null;
            }

            getPKT(name) {
                if (!this.excelData.pkt) return null;
                const row = this.findEmployeeRow(this.excelData.pkt, name);
                if (row) {
                    const avg = this.getAverageFromMonthColumns(row);
                    return avg > 0 ? avg : null;
                }
                return null;
            }

            getAttendance(name) {
                if (!this.excelData.attendance) return null;
                const row = this.findEmployeeRow(this.excelData.attendance, name);
                if (row) {
                    const leaves = Object.values(row).slice(1).filter(v => typeof v === 'number');
                    if (leaves.length > 0) {
                        const avgLeaves = leaves.reduce((a, b) => a + b, 0) / leaves.length;
                        const result = Math.max(0, 100 - (avgLeaves * 5));
                        return result > 0 ? result : null;
                    }
                }
                return null;
            }

            getNHPending(name) {
                if (!this.excelData.nhPending) return null;
                const cleanName = name.trim().toLowerCase();
                const statusColumn = 'Status';
                const auditorColumn = 'Auditor' || 'Processor';
                const pendingCount = this.excelData.nhPending.filter(row => {
                    const auditor = row[auditorColumn] || row['Processor'];
                    const status = row[statusColumn];
                    return auditor && auditor.toString().trim().toLowerCase().includes(cleanName) && status && status.toString().toLowerCase().includes('pending');
                }).length;
                return pendingCount > 0 ? 1 : 0;
            }

            getClientPending(name) {
                if (!this.excelData.clientAudit) return null;
                const row = this.findEmployeeRow(this.excelData.clientAudit, name);
                if (row) {
                    const lastVal = Object.values(row)[Object.values(row).length - 1];
                    const val = parseFloat(lastVal);
                    return !isNaN(val) ? val : null;
                }
                return null;
            }

            getInternalAuditErrors(name) {
                if (!this.excelData.internalAudit) return null;
                const cleanName = name.trim().toLowerCase();
                const teamMemberCol = 'Team Member';
                const ncaCol = 'NCA';
                const caCol = 'CA';

                let totalErrors = 0;
                let found = false;
                this.excelData.internalAudit.forEach(row => {
                    const teamMembers = (row[teamMemberCol] || '').toString().trim().toLowerCase();
                    if (teamMembers.includes(cleanName)) {
                        found = true;
                        totalErrors += (parseFloat(row[ncaCol]) || 0) + (parseFloat(row[caCol]) || 0);
                    }
                });
                return found ? totalErrors : null;
            }

            // HR Operations specific KPIs
            getDataChanges(name) {
                if (!this.excelData.dataChanges) return null;
                const cleanName = name.trim().toLowerCase();
                const completed = this.excelData.dataChanges.filter(row => {
                    const assignedTo = (row['Assigned to'] || '').toString().trim().toLowerCase();
                    const completedDate = row['Data Change Completed Date'];
                    return assignedTo.includes(cleanName) && completedDate;
                }).length;
                return completed > 0 ? 1 : 0;
            }

            getTenureDiscount(name) {
                if (!this.excelData.tenureDiscount) return null;
                const cleanName = name.trim().toLowerCase();
                const pending = this.excelData.tenureDiscount.filter(row => {
                    const teamMember = (row['Team Member'] || '').toString().trim().toLowerCase();
                    const status = (row['Status'] || '').toString().toLowerCase();
                    return teamMember.includes(cleanName) && status.includes('pending');
                }).length;
                return pending;
            }

            getTerminationStatus(name) {
                if (!this.excelData.termination) return null;
                const row = this.excelData.termination.find(r => {
                    const candName = r['Candidate Name'] || '';
                    return candName.toLowerCase().includes(name.toLowerCase());
                });
                return row ? row['Term Status'] || 'Active' : 'Active';
            }

            // Final Clearance specific KPIs
            getClearanceSLA(name) {
                if (!this.excelData.finalClearance) return null;
                const cleanName = name.trim().toLowerCase();
                const rows = this.excelData.finalClearance.filter(r => {
                    const auditor = (r['Audited By'] || '').toString().trim().toLowerCase();
                    return auditor.includes(cleanName);
                });

                if (rows.length === 0) return null;

                let totalDays = 0;
                rows.forEach(row => {
                    const dateReceived = new Date(row['Date Received']);
                    const dateAudited = new Date(row['Date Audited']);
                    if (dateReceived && dateAudited && !isNaN(dateReceived) && !isNaN(dateAudited)) {
                        const days = Math.ceil((dateAudited - dateReceived) / (1000 * 60 * 60 * 24));
                        totalDays += days;
                    }
                });

                return rows.length > 0 ? Math.round(totalDays / rows.length) : null;
            }

            getClearanceCount(name) {
                if (!this.excelData.finalClearance) return null;
                const cleanName = name.trim().toLowerCase();
                const count = this.excelData.finalClearance.filter(r => {
                    const auditor = (r['Audited By'] || '').toString().trim().toLowerCase();
                    const status = (r['Audit Status'] || '').toString().toLowerCase();
                    return auditor.includes(cleanName) && status.includes('cleared');
                }).length;
                return count > 0 ? count : null;
            }

            // Internal Audit specific KPIs
            getQMGTimeline(name) {
                if (!this.excelData.internalAuditTracker) return null;
                const cleanName = name.trim().toLowerCase();
                const rows = this.excelData.internalAuditTracker.filter(r => {
                    const auditor = (r['Auditor'] || '').toString().trim().toLowerCase();
                    return auditor.includes(cleanName);
                });

                if (rows.length === 0) return null;

                let totalDays = 0;
                let validDays = 0;
                rows.forEach(row => {
                    const docReceived = new Date(row['Document Receiv'] || row['Document Received']);
                    const processedQMG = new Date(row['Processed to QM'] || row['Processed to QMG']);
                    if (docReceived && processedQMG && !isNaN(docReceived) && !isNaN(processedQMG)) {
                        const days = Math.ceil((processedQMG - docReceived) / (1000 * 60 * 60 * 24));
                        totalDays += days;
                        validDays++;
                    }
                });

                return validDays > 0 ? Math.round(totalDays / validDays) : null;
            }

            getQMGErrors(name) {
                if (!this.excelData.qmgErrors) return null;
                const cleanName = name.trim().toLowerCase();
                const errors = this.excelData.qmgErrors.filter(r => {
                    const employee = (r['Employee Name'] || '').toString().trim().toLowerCase();
                    return employee.includes(cleanName);
                }).length;
                return errors > 0 ? errors : null;
            }

            getAuditCompletion(name) {
                if (!this.excelData.internalAuditTracker) return null;
                const cleanName = name.trim().toLowerCase();
                const assigned = this.excelData.internalAuditTracker.filter(r => {
                    const auditor = (r['Auditor'] || '').toString().trim().toLowerCase();
                    return auditor.includes(cleanName);
                }).length;
                const completed = this.excelData.internalAuditTracker.filter(r => {
                    const auditor = (r['Auditor'] || '').toString().trim().toLowerCase();
                    const processedQMG = r['Processed to QM'] || r['Processed to QMG'];
                    return auditor.includes(cleanName) && processedQMG;
                }).length;
                return assigned > 0 ? (completed / assigned) : null;
            }

            // Paperwork Clearance specific KPIs
            getPaperworkSLA(name) {
                if (!this.excelData.paperworkClearance) return null;
                const cleanName = name.trim().toLowerCase();
                const rows = this.excelData.paperworkClearance.filter(r => {
                    const auditor = (r['Audited by'] || r['Aduited BY'] || '').toString().trim().toLowerCase();
                    return auditor.includes(cleanName);
                });

                if (rows.length === 0) return null;

                let totalDays = 0;
                let validDays = 0;
                rows.forEach(row => {
                    const dateReceived = new Date(row['Received Date']);
                    const dateCompleted = new Date(row['Completed Date']);
                    if (dateReceived && dateCompleted && !isNaN(dateReceived) && !isNaN(dateCompleted)) {
                        const days = Math.ceil((dateCompleted - dateReceived) / (1000 * 60 * 60 * 24));
                        totalDays += days;
                        validDays++;
                    }
                });

                return validDays > 0 ? Math.round(totalDays / validDays) : null;
            }

            getAllocationCompletion(name) {
                if (!this.excelData.paperworkAllocation) return null;
                const cleanName = name.trim().toLowerCase();
                const assigned = this.excelData.paperworkAllocation.filter(r => {
                    const processor = (r['Processor'] || '').toString().trim().toLowerCase();
                    return processor.includes(cleanName);
                }).length;
                const completed = this.excelData.paperworkAllocation.filter(r => {
                    const processor = (r['Processor'] || '').toString().trim().toLowerCase();
                    const allocatedDate = r['Allocated On'];
                    return processor.includes(cleanName) && allocatedDate;
                }).length;
                return assigned > 0 ? (completed / assigned) : null;
            }

            getSummary() {
                const allEmps = Object.values(this.employees);
                return {
                    totalEmployees: allEmps.length,
                    avgScore: Math.round(allEmps.reduce((sum, e) => sum + (e.scores.teamScore || 0), 0) / allEmps.length),
                    avgProductivity: (allEmps.reduce((sum, e) => sum + (e.kpis.productivity || 0), 0) / allEmps.length).toFixed(1),
                    avgPKT: Math.round(allEmps.reduce((sum, e) => sum + (e.kpis.pkt || 0), 0) / allEmps.length),
                    eligible: { count: allEmps.filter(e => e.eligibility === 'Eligible').length, pct: Math.round((allEmps.filter(e => e.eligibility === 'Eligible').length / allEmps.length) * 100) },
                    green: { count: allEmps.filter(e => e.status === 'Green').length, pct: Math.round((allEmps.filter(e => e.status === 'Green').length / allEmps.length) * 100) },
                    amber: { count: allEmps.filter(e => e.status === 'Amber').length, pct: Math.round((allEmps.filter(e => e.status === 'Amber').length / allEmps.length) * 100) },
                    red: { count: allEmps.filter(e => e.status === 'Red').length, pct: Math.round((allEmps.filter(e => e.status === 'Red').length / allEmps.length) * 100) }
                };
            }

            saveToStorage() {
                const data = {
                    timestamp: new Date().toISOString(),
                    employees: this.employees,
                    teams: this.teams,
                    summary: this.getSummary()
                };
                localStorage.setItem('hrops_scorecard_data', JSON.stringify(data));
                return data;
            }
        }

        let selectedFiles = [];
        let engine = null;
        
        function handleFileSelect(event) {
            selectedFiles = Array.from(event.target.files).filter(f => f.name.endsWith('.xlsx') || f.name.endsWith('.xls'));
            displayFileList();
            updateProcessButton();
        }
        
        function handleFolderSelect(event) {
            selectedFiles = Array.from(event.target.files).filter(f => f.name.endsWith('.xlsx') || f.name.endsWith('.xls'));
            displayFileList();
            updateProcessButton();
        }
        
        function displayFileList() {
            const container = document.getElementById('fileListContainer');
            const list = document.getElementById('fileList');
            container.style.display = selectedFiles.length === 0 ? 'none' : 'block';
            list.innerHTML = '';
            selectedFiles.forEach((file, idx) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `<div><div class="file-name">${file.name}</div><div class="file-size">${(file.size / 1024).toFixed(2)} KB</div></div><button class="btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="removeFile(${idx})">Remove</button>`;
                list.appendChild(item);
            });
        }
        
        function removeFile(idx) {
            selectedFiles.splice(idx, 1);
            document.getElementById('fileInput').value = '';
            displayFileList();
            updateProcessButton();
        }
        
        function updateProcessButton() {
            document.getElementById('processBtn').disabled = selectedFiles.length === 0;
        }
        
        function clearFiles() {
            selectedFiles = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('fileListContainer').style.display = 'none';
            document.getElementById('processBtn').disabled = true;
            document.getElementById('progressSection').classList.remove('show');
            document.getElementById('resultsCard').style.display = 'none';
        }
        
        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            container.innerHTML = '';
            container.appendChild(alert);
        }
        
        function updateProgress(overall) {
            document.getElementById('progressPercent').textContent = overall + '%';
            document.getElementById('progressFill').style.width = overall + '%';
        }
        
        async function processFiles() {
            if (selectedFiles.length === 0) {
                showAlert('❌ Please select Excel files first', 'error');
                return;
            }
            
            document.getElementById('progressSection').classList.add('show');
            document.getElementById('resultsCard').style.display = 'none';
            showAlert('⏳ Processing files with team-wise KPI logic...', 'info');
            updateProgress(10);
            
            try {
                engine = new TeamKPIEngine();
                updateProgress(20);
                
                await engine.processExcelFiles(selectedFiles);
                updateProgress(70);
                
                const saved = engine.saveToStorage();
                updateProgress(100);
                
                setTimeout(() => {
                    displayResults(saved);
                    showAlert('✅ Team-wise scorecard data processed successfully!', 'success');
                }, 500);
                
            } catch (error) {
                console.error('Error:', error);
                showAlert(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        function displayResults(data) {
            document.getElementById('resultsCard').style.display = 'block';
            const stats = data.summary;
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card"><div class="stat-label">Total Employees</div><div class="stat-value">${stats.totalEmployees}</div></div>
                <div class="stat-card"><div class="stat-label">Avg Score</div><div class="stat-value">${stats.avgScore}</div></div>
                <div class="stat-card"><div class="stat-label">Avg PKT</div><div class="stat-value">${stats.avgPKT}</div></div>
                <div class="stat-card"><div class="stat-label">Avg Productivity</div><div class="stat-value">${stats.avgProductivity}h</div></div>
                <div class="stat-card"><div class="stat-label">Eligible</div><div class="stat-value">${stats.eligible.count}</div></div>
                <div class="stat-card"><div class="stat-label">Green Status</div><div class="stat-value">${stats.green.count}</div></div>
            `;
        }
    </script>
</body>
</html>
