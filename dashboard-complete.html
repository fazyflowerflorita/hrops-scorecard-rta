<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Operations Scorecard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0d7c6f 0%, #14a596 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #111827;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #0d7c6f 0%, #14a596 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .filter-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        select {
            padding: 0.5rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #0d7c6f;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #0d7c6f;
        }

        .summary-card h3 {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .summary-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0d7c6f;
        }

        .employees-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .employee-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            border-top: 4px solid #0d7c6f;
        }

        .employee-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        }

        .emp-header {
            margin-bottom: 1rem;
        }

        .emp-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .emp-team {
            display: inline-block;
            background: linear-gradient(135deg, #0d7c6f 0%, #14a596 100%);
            color: white;
            padding: 0.35rem 0.75rem;
            border-radius: 0.35rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .score-section {
            background: linear-gradient(135deg, #f0fdf4 0%, #f0fdf4 100%);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #10b981;
        }

        .overall-score {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .score-value {
            font-size: 2rem;
            font-weight: 700;
            color: #10b981;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .kpi-item {
            background: #f9fafb;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .kpi-label {
            font-size: 0.7rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.35rem;
        }

        .kpi-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #111827;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0d7c6f 0%, #14a596 100%);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .modal-content {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 700px;
            width: 100%;
            margin-top: 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e5e7eb;
        }

        .modal-title h2 {
            font-size: 1.8rem;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #9ca3af;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #111827;
        }

        .overall-section {
            background: linear-gradient(135deg, #0d7c6f 0%, #14a596 100%);
            color: white;
            padding: 2rem;
            border-radius: 0.75rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .overall-section h3 {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .overall-section .score {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .kpi-detail {
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            border-radius: 0.75rem;
            border-left: 4px solid #0d7c6f;
        }

        .kpi-detail h3 {
            font-size: 1rem;
            color: #111827;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .kpi-detail-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0d7c6f;
            margin-bottom: 0.75rem;
        }

        .kpi-detail .progress-bar {
            height: 8px;
        }

        .no-data {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 0.75rem;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }
            .employees-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 HR Operations Scorecard</h1>
            <p style="color: #6b7280; margin-top: 0.5rem;">Real-Time Performance Dashboard</p>
            
            <div class="filters">
                <div class="filter-group">
                    <label for="teamFilter">Team:</label>
                    <select id="teamFilter" onchange="filterByTeam()">
                        <option value="">🔵 All Teams</option>
                        <option value="Compliance Team">Compliance Team</option>
                        <option value="Final Clearance Team">Final Clearance Team</option>
                        <option value="HR Operations Team">HR Operations Team</option>
                        <option value="Internal Audit Team">Internal Audit Team</option>
                        <option value="Paperwork Audit Team">Paperwork Audit Team</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="summary-cards">
            <div class="summary-card">
                <h3>Total Employees</h3>
                <div class="value" id="totalEmp">0</div>
            </div>
            <div class="summary-card">
                <h3>Avg Score</h3>
                <div class="value" id="avgScore">0%</div>
            </div>
            <div class="summary-card">
                <h3>Above Target</h3>
                <div class="value" id="aboveTarget">0</div>
            </div>
            <div class="summary-card">
                <h3>Below Target</h3>
                <div class="value" id="belowTarget">0</div>
            </div>
        </div>

        <div id="employeesContainer" class="employees-grid"></div>
    </div>

    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">
                    <h2 id="modalName"></h2>
                    <div class="emp-team" id="modalTeam"></div>
                </div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="overall-section">
                <h3>OVERALL SCORE</h3>
                <div class="score" id="modalScore">0%</div>
            </div>

            <div id="kpiDetails"></div>
        </div>
    </div>

    <script>
        // COMPLETE EMPLOYEE DATA WITH ALL METRICS
        const employees = [
            // Compliance Team
            { id: 1, name: 'Sayee Nivas B', team: 'Compliance Team', knowledge: 92, attendance: 95, productivity: 24, pending: 2 },
            { id: 2, name: 'Alan Benjamin', team: 'Compliance Team', knowledge: 88, attendance: 92, productivity: 22, pending: 1 },
            { id: 3, name: 'Pavithra M', team: 'Compliance Team', knowledge: 95, attendance: 98, productivity: 26, pending: 0 },
            { id: 4, name: 'Latha J', team: 'Compliance Team', knowledge: 85, attendance: 90, productivity: 20, pending: 3 },
            { id: 5, name: 'Sneha Thomas', team: 'Compliance Team', knowledge: 90, attendance: 94, productivity: 23, pending: 1 },
            { id: 6, name: 'Azhar Taj', team: 'Compliance Team', knowledge: 87, attendance: 91, productivity: 21, pending: 2 },
            { id: 7, name: 'Rathina Sudhan K', team: 'Compliance Team', knowledge: 93, attendance: 96, productivity: 25, pending: 0 },
            
            // Final Clearance Team
            { id: 8, name: 'Archana Gautam', team: 'Final Clearance Team', knowledge: 91, attendance: 97, productivity: 28, pending: 1 },
            { id: 9, name: 'Aswani R', team: 'Final Clearance Team', knowledge: 89, attendance: 93, productivity: 24, pending: 2 },
            { id: 10, name: 'Anubha Priyam', team: 'Final Clearance Team', knowledge: 94, attendance: 99, productivity: 30, pending: 0 },
            
            // HR Operations Team
            { id: 11, name: 'Arjun MP', team: 'HR Operations Team', knowledge: 86, attendance: 88, productivity: 19, pending: 4 },
            { id: 12, name: 'Ingrid Mary Pope', team: 'HR Operations Team', knowledge: 92, attendance: 95, productivity: 25, pending: 1 },
            { id: 13, name: 'M Rihana', team: 'HR Operations Team', knowledge: 88, attendance: 91, productivity: 22, pending: 2 },
            { id: 14, name: 'Ramesh Kumar Selvaraj', team: 'HR Operations Team', knowledge: 85, attendance: 89, productivity: 21, pending: 3 },
            
            // Internal Audit Team
            { id: 15, name: 'Yogeshwaran R', team: 'Internal Audit Team', knowledge: 93, attendance: 96, productivity: 27, pending: 1 },
            { id: 16, name: 'Banupriya B', team: 'Internal Audit Team', knowledge: 90, attendance: 94, productivity: 24, pending: 2 },
            
            // Paperwork Audit Team
            { id: 17, name: 'Leonie Gomes', team: 'Paperwork Audit Team', knowledge: 87, attendance: 92, productivity: 23, pending: 2 },
            { id: 18, name: 'Thirisha Manoharan', team: 'Paperwork Audit Team', knowledge: 89, attendance: 93, productivity: 25, pending: 1 },
            { id: 19, name: 'Vinish Navinkumar', team: 'Paperwork Audit Team', knowledge: 86, attendance: 90, productivity: 22, pending: 3 },
        ];

        let filtered = [...employees];

        function calculateScore(emp) {
            return Math.round((emp.knowledge + emp.attendance) / 2);
        }

        function getStatus(score) {
            if (score >= 90) return { text: 'Excellent', color: '#10b981' };
            if (score >= 75) return { text: 'Good', color: '#3b82f6' };
            if (score >= 50) return { text: 'Average', color: '#f59e0b' };
            return { text: 'Below Target', color: '#ef4444' };
        }

        function updateSummary() {
            const total = filtered.length;
            let avgScore = 0;
            let above = 0;
            let below = 0;

            filtered.forEach(emp => {
                const score = calculateScore(emp);
                avgScore += score;
                if (score >= 75) above++;
                else below++;
            });

            avgScore = total > 0 ? Math.round(avgScore / total) : 0;

            document.getElementById('totalEmp').textContent = total;
            document.getElementById('avgScore').textContent = avgScore + '%';
            document.getElementById('aboveTarget').textContent = above;
            document.getElementById('belowTarget').textContent = below;
        }

        function renderEmployees() {
            const container = document.getElementById('employeesContainer');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-data">No employees in this team</div>';
                return;
            }

            filtered.forEach(emp => {
                const score = calculateScore(emp);
                const status = getStatus(score);

                const card = document.createElement('div');
                card.className = 'employee-card';
                card.onclick = () => showDetail(emp);

                card.innerHTML = `
                    <div class="emp-header">
                        <div class="emp-name">${emp.name}</div>
                        <div class="emp-team">${emp.team}</div>
                    </div>

                    <div class="score-section">
                        <div class="overall-score">OVERALL SCORE</div>
                        <div class="score-value" style="color: ${status.color}">${score}%</div>
                    </div>

                    <div class="kpi-grid">
                        <div class="kpi-item">
                            <div class="kpi-label">📚 Knowledge</div>
                            <div class="kpi-value">${emp.knowledge}%</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${emp.knowledge}%"></div>
                            </div>
                        </div>
                        <div class="kpi-item">
                            <div class="kpi-label">📅 Attendance</div>
                            <div class="kpi-value">${emp.attendance}%</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${emp.attendance}%"></div>
                            </div>
                        </div>
                        <div class="kpi-item">
                            <div class="kpi-label">⚡ Production</div>
                            <div class="kpi-value">${emp.productivity}</div>
                        </div>
                        <div class="kpi-item">
                            <div class="kpi-label">📋 Pending</div>
                            <div class="kpi-value">${emp.pending}</div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function showDetail(emp) {
            const score = calculateScore(emp);
            const status = getStatus(score);

            document.getElementById('modalName').textContent = emp.name;
            document.getElementById('modalTeam').textContent = emp.team;
            document.getElementById('modalScore').textContent = score + '%';

            let kpiHtml = `
                <div class="kpi-detail">
                    <h3>📚 Process Knowledge</h3>
                    <div class="kpi-detail-value">${emp.knowledge}%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${emp.knowledge}%"></div>
                    </div>
                </div>

                <div class="kpi-detail">
                    <h3>📅 Attendance</h3>
                    <div class="kpi-detail-value">${emp.attendance}%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${emp.attendance}%"></div>
                    </div>
                </div>

                <div class="kpi-detail">
                    <h3>⚡ Production Units</h3>
                    <div class="kpi-detail-value">${emp.productivity}</div>
                </div>

                <div class="kpi-detail">
                    <h3>📋 NH Pending</h3>
                    <div class="kpi-detail-value">${emp.pending}</div>
                </div>
            `;

            document.getElementById('kpiDetails').innerHTML = kpiHtml;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal(event) {
            if (event && event.target.id !== 'modal') return;
            document.getElementById('modal').classList.remove('active');
        }

        function filterByTeam() {
            const selected = document.getElementById('teamFilter').value;
            filtered = selected ? employees.filter(e => e.team === selected) : [...employees];
            updateSummary();
            renderEmployees();
        }

        // Initialize
        window.addEventListener('load', () => {
            updateSummary();
            renderEmployees();
        });
    </script>
</body>
</html>
