<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Scorecard - Associate Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .navbar { background: white; padding: 20px 30px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .navbar h1 { font-size: 24px; color: #333; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link { padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; background: #f0f0f0; color: #333; transition: all 0.3s; }
        .nav-link:hover { background: #667eea; color: white; }
        .nav-link.active { background: #667eea; color: white; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; font-size: 22px; }
        h3 { color: #1a1a1a; margin: 25px 0 15px 0; font-size: 16px; font-weight: 700; }
        .tabs { display: flex; gap: 10px; border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; padding: 12px 20px; font-size: 14px; font-weight: 700; color: #333; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab-btn:hover { color: #667eea; background: #f0f4f8; border-radius: 4px; }
        .tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
        .profile-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; }
        .profile-header h2 { color: white; margin: 0 0 10px 0; }
        .profile-info { font-size: 14px; opacity: 0.95; }
        .kpi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .kpi-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .kpi-card.green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .kpi-card.amber { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .kpi-card.red { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .kpi-label { font-size: 10px; opacity: 0.9; text-transform: uppercase; margin-bottom: 6px; }
        .kpi-value { font-size: 26px; font-weight: bold; }
        .kpi-subtitle { font-size: 10px; opacity: 0.8; margin-top: 6px; }
        .incentive-card { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 20px; border-radius: 8px; margin: 10px 0; }
        .incentive-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; padding: 12px; background: #f8f9ff; border-left: 4px solid #667eea; margin: 8px 0; border-radius: 6px; }
        .incentive-label { font-weight: 600; color: #1a1a1a; }
        .incentive-value { text-align: right; font-weight: 700; font-size: 16px; color: #1a3a52; }
        .incentive-status { text-align: center; font-weight: 600; }
        .incentive-footer { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: right; font-size: 18px; font-weight: 700; }
        .incentive-warning { background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; border-radius: 6px; color: #856404; margin: 10px 0; font-weight: 600; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: 600; }
        .status-green { background: #d4edda; color: #155724; }
        .status-amber { background: #fff3cd; color: #856404; }
        .status-red { background: #f8d7da; color: #721c24; }
        .status-blue { background: #d1ecf1; color: #0c5460; }
        .table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .table th { background: #e8ecf8; padding: 12px; text-align: left; font-weight: 700; color: #1a1a1a; border-bottom: 3px solid #667eea; text-transform: uppercase; font-size: 12px; }
        .table td { padding: 12px; border-bottom: 1px solid #e0e0e0; color: #333; }
        @media (max-width: 768px) { 
            .incentive-row { grid-template-columns: 1fr; }
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>👤 My Personal Scorecard & Incentives</h1>
        <div class="nav-links">
            <a href="admin.html" class="nav-link">Admin</a>
            <a href="manager.html" class="nav-link">Manager</a>
            <a href="#" class="nav-link active">Associate</a>
        </div>
    </div>
    
    <div class="container">
        <div class="card">
            <!-- EMPLOYEE SELECTOR -->
            <div style="background: #f8f9ff; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #667eea;">
                <h3>🔍 Select Your Profile</h3>
                <div style="display: grid; grid-template-columns: 2fr 1fr auto; gap: 15px; align-items: end; margin-bottom: 15px;">
                    <div>
                        <label style="font-weight: 600; color: #333; display: block; margin-bottom: 8px;">Employee Name</label>
                        <select id="employeeSelect" onchange="selectEmployee()" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 13px;">
                            <option value="">-- Select Employee --</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-weight: 600; color: #333; display: block; margin-bottom: 8px;">Employee ID</label>
                        <input type="text" id="empIdSearch" placeholder="e.g., P11561" onkeyup="searchEmployee()" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px;">
                    </div>
                    <button onclick="downloadPDF()" style="background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600;">📥 PDF</button>
                </div>
            </div>

            <!-- DATE FILTERS -->
            <div id="dateFiltersContainer" style="display:none; background: #f0f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #667eea;">
                <h4 style="color: #1a1a1a; margin-bottom: 12px; font-size: 13px; font-weight: 700; text-transform: uppercase;">📅 Date & Filter Controls</h4>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;">
                    <div>
                        <label style="font-weight: 600; color: #333; font-size: 12px; display: block; margin-bottom: 6px;">📆 YEAR</label>
                        <select id="yearFilter" onchange="applyDateFilter()" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 12px;">
                            <option value="">All Years</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-weight: 600; color: #333; font-size: 12px; display: block; margin-bottom: 6px;">📅 MONTH</label>
                        <select id="monthFilter" onchange="applyDateFilter()" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 12px;">
                            <option value="">All Months</option>
                            <option value="01">January</option>
                            <option value="02">February</option>
                            <option value="03">March</option>
                            <option value="04">April</option>
                            <option value="05">May</option>
                            <option value="06">June</option>
                            <option value="07">July</option>
                            <option value="08">August</option>
                            <option value="09">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-weight: 600; color: #333; font-size: 12px; display: block; margin-bottom: 6px;">📍 FROM DATE</label>
                        <input type="date" id="dateFromFilter" onchange="applyDateFilter()" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 12px;">
                    </div>
                    <div>
                        <label style="font-weight: 600; color: #333; font-size: 12px; display: block; margin-bottom: 6px;">📍 TO DATE</label>
                        <input type="date" id="dateToFilter" onchange="applyDateFilter()" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 12px;">
                    </div>
                    <div style="display: flex; align-items: flex-end;">
                        <button onclick="clearDateFilters()" style="width: 100%; background: #ccc; color: #333; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px;">🔄 Reset</button>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 11px; color: #666; background: #fff; padding: 8px; border-radius: 4px;">
                    💡 <strong>Tip:</strong> Use filters to view your performance for specific time periods.
                </div>
            </div>

            <!-- TABS -->
            <div id="tabsContainer" style="display:none;">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('profile')">📋 Profile</button>
                    <button class="tab-btn" onclick="switchTab('kpis')">📊 KPIs</button>
                    <button class="tab-btn" onclick="switchTab('incentive')">💰 Incentive</button>
                </div>
            </div>

            <div id="contentArea"></div>
        </div>
    </div>

    <script>
        let data = null;
        let allEmployees = [];
        let currentEmployee = null;
        let currentTab = 'profile';

        // INCENTIVE STRUCTURE (Same as Manager)
        const incentiveStructure = {
            'Executive': {
                components: [
                    { name: 'Productivity', weightage: 26, maxAmount: 1150, kpi: 'productivity', threshold: 85, target: 100 },
                    { name: 'Audit Timelines / SLA', weightage: 17, maxAmount: 750, kpi: 'clearanceSLA', threshold: 85, target: 100 },
                    { name: 'Quality Score', weightage: 30, maxAmount: 1150, kpi: 'internalAuditErrors', hasDelimiters: true },
                    { name: 'Process Knowledge Test', weightage: 0, maxAmount: 250, kpi: 'pkt', threshold: 85, target: 90 },
                    { name: 'BG/NH Pending', weightage: 0, maxAmount: 750, kpi: 'nhPending' },
                    { name: 'Leave Compliance', weightage: 0, maxAmount: 450, kpi: 'attendance' }
                ]
            },
            'Auditor': {
                components: [
                    { name: 'Productivity', weightage: 15, maxAmount: 625, kpi: 'productivity', threshold: 85, target: 100 },
                    { name: 'Audit Timelines / SLA', weightage: 30, maxAmount: 1050, kpi: 'qmgTimeline', threshold: 85, target: 100 },
                    { name: 'Quality Score', weightage: 30, maxAmount: 1375, kpi: 'qmgNCAErrors', hasDelimiters: true },
                    { name: 'Process Knowledge Test', weightage: 10, maxAmount: 250, kpi: 'pkt', threshold: 85, target: 90 },
                    { name: 'BG/NH Pending', weightage: 10, maxAmount: 750, kpi: 'nhPending' },
                    { name: 'Leave Compliance', weightage: 5, maxAmount: 450, kpi: 'attendance' }
                ]
            },
            'Process Lead': {
                components: [
                    { name: 'Productivity', weightage: 15, maxAmount: 700, kpi: 'productivity', threshold: 85, target: 100 },
                    { name: 'Audit Timelines / SLA', weightage: 25, maxAmount: 950, kpi: 'qmgTimeline', threshold: 85, target: 100 },
                    { name: 'Quality Score', weightage: 30, maxAmount: 1050, kpi: 'qmgNCAErrors', hasDelimiters: true },
                    { name: 'Process Knowledge Test', weightage: 10, maxAmount: 450, kpi: 'pkt', threshold: 85, target: 90 },
                    { name: 'SOP & Trainings', weightage: 20, maxAmount: 900, kpi: 'auditCompletion' },
                    { name: 'Leave Compliance', weightage: 5, maxAmount: 450, kpi: 'attendance' }
                ]
            }
        };

        function getRoleByTeam(team) {
            const roleMap = {
                'HR Operations': 'Executive',
                'Compliance': 'Auditor',
                'Final Clearance': 'Auditor',
                'Internal Audit': 'Auditor',
                'Paperwork Clearance': 'Process Lead'
            };
            return roleMap[team] || 'Executive';
        }

        function calculateIncentive(emp) {
            const role = getRoleByTeam(emp.team);
            const structure = incentiveStructure[role];
            const components = [];
            let totalIncentive = 0;
            let hasCAError = emp.kpis.qmgCAErrors > 0 || emp.kpis.internalAuditErrors > 0;

            structure.components.forEach(comp => {
                let amount = 0;
                let status = 'Not Eligible';

                if (comp.name === 'Productivity') {
                    const achieved = emp.kpis.productivity;
                    if (achieved >= 100) {
                        amount = comp.maxAmount;
                        status = 'Full';
                    } else if (achieved >= comp.threshold) {
                        amount = (achieved / comp.target) * comp.maxAmount;
                        status = 'Partial';
                    }
                } else if (comp.name === 'Quality Score') {
                    // CA ERROR RULE
                    if (hasCAError) {
                        amount = 0;
                        status = '❌ CA Error';
                    } else {
                        const errors = (emp.kpis.qmgCAErrors || 0) + (emp.kpis.qmgNCAErrors || 0);
                        const qualityPercent = Math.max(0, 100 - (errors * 5));
                        if (qualityPercent >= 99.5) {
                            amount = comp.maxAmount;
                            status = 'Excellent';
                        } else if (qualityPercent >= 95) {
                            amount = (qualityPercent / 99.5) * comp.maxAmount;
                            status = 'Good';
                        }
                    }
                } else if (comp.name === 'Process Knowledge Test') {
                    const pkt = emp.kpis.pkt;
                    if (pkt >= 90) {
                        amount = comp.maxAmount;
                        status = 'Full';
                    } else if (pkt >= 85) {
                        amount = (pkt / 90) * comp.maxAmount;
                        status = 'Partial';
                    }
                } else if (comp.name === 'BG/NH Pending') {
                    if (emp.kpis.nhPending === 0) {
                        amount = comp.maxAmount;
                        status = 'Full';
                    }
                } else if (comp.name === 'Leave Compliance') {
                    if (emp.kpis.attendance >= 95) {
                        amount = comp.maxAmount;
                        status = 'Full';
                    }
                } else if (comp.name === 'Audit Timelines / SLA') {
                    const sla = emp.kpis[comp.kpi];
                    if (sla <= 2) {
                        amount = comp.maxAmount;
                        status = 'Full';
                    }
                }

                totalIncentive += amount;
                components.push({
                    name: comp.name,
                    maxAmount: comp.maxAmount,
                    amount: Math.round(amount),
                    status: status
                });
            });

            return {
                role: role,
                components: components,
                totalIncentive: Math.round(totalIncentive),
                hasCAError: hasCAError
            };
        }

        function loadData() {
            const stored = localStorage.getItem('hrops_scorecard_data');
            if (!stored) {
                document.getElementById('contentArea').innerHTML = '<p style="color: #666; font-size: 14px;">No data found. Please upload files in Admin panel first.</p>';
                return;
            }
            
            data = JSON.parse(stored);
            allEmployees = Object.values(data.employees || {});
            populateSelectors();
        }

        function populateSelectors() {
            const select = document.getElementById('employeeSelect');
            select.innerHTML = '<option value="">-- Select Employee --</option>';
            allEmployees.forEach(emp => {
                const opt = document.createElement('option');
                opt.value = emp.id;
                opt.textContent = `${emp.name} (${emp.id})`;
                select.appendChild(opt);
            });
        }

        function searchEmployee() {
            const empId = document.getElementById('empIdSearch').value.toUpperCase();
            const found = allEmployees.find(e => e.id.toUpperCase() === empId);
            if (found) {
                currentEmployee = found;
                document.getElementById('employeeSelect').value = found.id;
                document.getElementById('dateFiltersContainer').style.display = 'block';
                document.getElementById('tabsContainer').style.display = 'block';
                switchTab('profile');
            }
        }

        function selectEmployee() {
            const empId = document.getElementById('employeeSelect').value;
            if (empId) {
                currentEmployee = allEmployees.find(e => e.id === empId);
                document.getElementById('empIdSearch').value = empId;
                document.getElementById('dateFiltersContainer').style.display = 'block';
                document.getElementById('tabsContainer').style.display = 'block';
                currentTab = 'profile';
                switchTab('profile');
            }
        }

        function applyDateFilter() {
            const year = document.getElementById('yearFilter').value;
            const month = document.getElementById('monthFilter').value;
            const dateFrom = document.getElementById('dateFromFilter').value;
            const dateTo = document.getElementById('dateToFilter').value;
            
            // Create a display message
            let filterMsg = [];
            if (year) filterMsg.push(`Year: ${year}`);
            if (month) {
                const monthNames = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                filterMsg.push(`Month: ${monthNames[parseInt(month)]}`);
            }
            if (dateFrom) filterMsg.push(`From: ${dateFrom}`);
            if (dateTo) filterMsg.push(`To: ${dateTo}`);
            
            // Refresh current tab
            if (currentTab === 'profile') renderProfile();
            else if (currentTab === 'kpis') renderKPIs();
            else if (currentTab === 'incentive') renderIncentive();
        }

        function clearDateFilters() {
            document.getElementById('yearFilter').value = '';
            document.getElementById('monthFilter').value = '';
            document.getElementById('dateFromFilter').value = '';
            document.getElementById('dateToFilter').value = '';
            
            if (currentEmployee) {
                if (currentTab === 'profile') renderProfile();
                else if (currentTab === 'kpis') renderKPIs();
                else if (currentTab === 'incentive') renderIncentive();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'profile') renderProfile();
            else if (tab === 'kpis') renderKPIs();
            else if (tab === 'incentive') renderIncentive();
        }

        function renderProfile() {
            const emp = currentEmployee;
            const html = `
                <div class="profile-header">
                    <h2>👤 ${emp.name}</h2>
                    <div class="profile-info">
                        <strong>Employee ID:</strong> ${emp.id} | 
                        <strong>Team:</strong> ${emp.team} | 
                        <strong>Role:</strong> ${getRoleByTeam(emp.team)}
                    </div>
                    <div style="margin-top: 10px; font-size: 12px; opacity: 0.9;">
                        ℹ️ This is your personal scorecard. Only you can view your data.
                    </div>
                </div>
                <div class="kpi-cards">
                    <div class="kpi-card ${emp.status.toLowerCase()}">
                        <div class="kpi-label">Overall Score</div>
                        <div class="kpi-value">${emp.scores.teamScore || 0}</div>
                        <div class="kpi-subtitle">${emp.status}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Incentive Status</div>
                        <div class="kpi-value">${emp.eligibility.charAt(0)}</div>
                        <div class="kpi-subtitle">${emp.eligibility}</div>
                    </div>
                </div>
            `;
            document.getElementById('contentArea').innerHTML = html;
        }

        function renderKPIs() {
            const emp = currentEmployee;
            const teamKPIs = getTeamKPIs(emp.team);
            let html = '<h3>📊 Team-Specific KPIs</h3><div style="width: 100%; overflow-x: auto;"><table class="table"><tr><th>KPI</th><th>Value</th><th>Status</th></tr>';
            
            teamKPIs.forEach(kpiName => {
                const value = emp.kpis[kpiName];
                const status = emp.kpis[kpiName + 'Status'] || 'Blue';
                html += `
                    <tr>
                        <td><strong>${formatKPIName(kpiName)}</strong></td>
                        <td>${getKPIDisplay(kpiName, value)}</td>
                        <td><span class="status-badge status-${status.toLowerCase()}">${status}</span></td>
                    </tr>
                `;
            });
            
            html += '</table></div>';
            document.getElementById('contentArea').innerHTML = html;
        }

        function renderIncentive() {
            const emp = currentEmployee;
            const incentive = calculateIncentive(emp);
            
            let html = `<h3>💰 Incentive Breakdown - ${incentive.role}</h3>`;
            
            if (incentive.hasCAError) {
                html += `<div class="incentive-warning">
                    ⚠️ <strong>Customer Affecting (CA) Error Detected:</strong> Quality Score component = ₹0
                </div>`;
            }
            
            incentive.components.forEach(comp => {
                html += `
                    <div class="incentive-row">
                        <div class="incentive-label">${comp.name}</div>
                        <div class="incentive-value">₹${comp.amount.toLocaleString()}</div>
                        <div class="incentive-status"><span class="status-badge status-${comp.status === 'Full' || comp.status === 'Excellent' ? 'green' : comp.status === 'Partial' || comp.status === 'Good' ? 'amber' : 'red'}">${comp.status}</span></div>
                    </div>
                `;
            });
            
            html += `
                <div class="incentive-footer">
                    💰 Total Incentive: ₹${incentive.totalIncentive.toLocaleString()}
                </div>
            `;
            
            document.getElementById('contentArea').innerHTML = html;
        }

        function getTeamKPIs(team) {
            const kpiMaps = {
                'HR Operations': ['productivity', 'nhPending', 'dataChanges', 'terminationStatus', 'tenureDiscount', 'pkt', 'attendance', 'clientPending'],
                'Compliance': ['productivity', 'nhPending', 'internalAuditErrors', 'pkt', 'attendance', 'clientPending'],
                'Final Clearance': ['productivity', 'internalAuditErrors', 'clearanceSLA', 'clearanceCount', 'pkt', 'attendance', 'clientPending'],
                'Internal Audit': ['productivity', 'nhPending', 'qmgTimeline', 'qmgNCAErrors', 'qmgCAErrors', 'auditCompletion', 'pkt', 'attendance', 'clientPending'],
                'Paperwork Clearance': ['productivity', 'nhPending', 'internalAuditErrors', 'paperworkSLA', 'allocationCompletion', 'pkt', 'attendance', 'clientPending']
            };
            return kpiMaps[team] || [];
        }

        function formatKPIName(name) {
            if (name.toLowerCase() === 'pkt') return 'PKT';
            return name.replace(/([A-Z])/g, ' $1').trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function getKPIDisplay(kpiName, value) {
            if (kpiName === 'clearanceSLA' || kpiName === 'paperworkSLA' || kpiName === 'qmgTimeline') {
                return `${value} days`;
            } else if (kpiName === 'pkt') {
                return `${Math.round(value)}`;
            } else if (typeof value === 'number' && value < 1) {
                return `${(value * 100).toFixed(2)}%`;
            } else if (kpiName === 'attendance' || kpiName === 'auditCompletion' || kpiName === 'allocationCompletion') {
                return `${value?.toFixed?.(2) || value}%`;
            } else if (typeof value === 'number') {
                return `${value.toFixed(2)}`;
            }
            return value || 'N/A';
        }

        function downloadPDF() {
            if (!currentEmployee) {
                alert('Please select an employee first');
                return;
            }
            alert('📥 Downloading scorecard PDF...');
        }

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
