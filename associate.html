<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Associate Scorecard - HR Operations</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: opacity 0.3s;
        }
        
        .navbar a:hover {
            opacity: 0.7;
        }
        
        .container {
            width: 100%;
            max-width: 700px;
            margin-top: 80px;
        }
        
        .search-box {
            background: white;
            border-radius: 12px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            margin-bottom: 30px;
        }
        
        .search-box h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .search-box p {
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .search-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .search-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .search-button:active {
            transform: translateY(0);
        }
        
        .scorecard {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
        }
        
        .scorecard.active {
            display: block;
        }
        
        .scorecard-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .employee-name {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }
        
        .employee-id {
            color: #999;
            font-size: 13px;
        }
        
        .metric {
            margin-bottom: 25px;
        }
        
        .metric-label {
            color: #666;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        
        .metric-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .metric-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
        }
        
        .back-button {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .back-button:hover {
            color: #764ba2;
        }
        
        .status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .scorecard-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 24px;
        }

        .mini-scorecard {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.16);
            cursor: pointer;
        }

        .mini-scorecard strong {
            color: #333;
            display: block;
            margin-bottom: 4px;
        }

        .mini-scorecard span {
            color: #999;
            font-size: 12px;
        }

        .mini-scorecard .mini-score {
            color: #667eea;
            font-size: 24px;
            font-weight: 700;
            margin-top: 12px;
        }
        
        @media (max-width: 600px) {
            .search-box {
                padding: 30px 20px;
            }
            
            .search-box h1 {
                font-size: 24px;
            }
            
            .scorecard {
                padding: 25px;
            }
            
            .employee-name {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div>👤 My Scorecard</div>
        <div>
            <a href="index.html">← Home</a>
            <a href="manager.html">Manager</a>
            <a href="admin.html">Admin</a>
        </div>
    </div>
    
    <div class="container">
        <!-- Search Section -->
        <div class="search-box" id="searchSection">
            <h1>👤 My Scorecard</h1>
            <p>Enter your Employee ID to view your performance scorecard</p>
            <input 
                type="text" 
                class="search-input" 
                id="employeeId" 
                placeholder="e.g., P11561"
                onkeyup="if(event.key === 'Enter') searchEmployee()"
            />
            <button class="search-button" onclick="searchEmployee()">🔍 Search</button>
            <div id="status" class="status"></div>
        </div>
        
        <!-- Scorecard Display -->
        <div class="scorecard" id="scorecard">
            <a href="javascript:goBack()" class="back-button">← Search Again</a>
            
            <div class="scorecard-header">
                <div class="employee-name" id="displayName"></div>
                <div class="employee-id" id="displayId"></div>
            </div>
            
            <div class="metric">
                <div class="metric-label">Overall Score</div>
                <div class="metric-value" id="scoreOverall">-</div>
                <div class="metric-bar">
                    <div class="metric-bar-fill" id="barOverall" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="metric">
                <div class="metric-label">Attendance</div>
                <div class="metric-value" id="scoreAttendance">-</div>
                <div class="metric-bar">
                    <div class="metric-bar-fill" id="barAttendance" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="metric">
                <div class="metric-label">Process Knowledge</div>
                <div class="metric-value" id="scoreKnowledge">-</div>
                <div class="metric-bar">
                    <div class="metric-bar-fill" id="barKnowledge" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="metric">
                <div class="metric-label">Productivity</div>
                <div class="metric-value" id="scoreProductivity">-</div>
            </div>
        </div>

        <div id="allScorecards" class="scorecard-list"></div>
    </div>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD_ToRRVy18YjH_V0M67DZ9Pd6LcSqDQqg",
            authDomain: "hrops-scorecard---rta.firebaseapp.com",
            projectId: "hrops-scorecard---rta",
            databaseURL: "https://hrops-scorecard---rta.firebaseio.com",
            storageBucket: "hrops-scorecard---rta.firebasestorage.app",
            messagingSenderId: "127519107306",
            appId: "1:127519107306:web:61683e0eb03874b0a94f93",
            measurementId: "G-K5H5SV6QQE"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let allEmployees = [];
        
        function toNumber(value) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function buildEmployeeRows(emps, perfs) {
            const ids = new Set([...Object.keys(emps), ...Object.keys(perfs)]);

            return Array.from(ids).map(id => {
                const emp  = emps[id]  || {};
                const perf = perfs[id] || {};
                const attendance = toNumber(perf.attendance);
                const knowledge  = toNumber(perf.process_knowledge);
                const audit      = toNumber(perf.audit_score);
                const scoreInputs = [attendance, knowledge, audit].filter(v => v > 0);
                const calculatedScore = scoreInputs.length
                    ? scoreInputs.reduce((s, v) => s + v, 0) / scoreInputs.length
                    : 0;

                return {
                    id,
                    name:             emp.name || perf.name || id,
                    attendance,
                    process_knowledge: knowledge,
                    productivity:     toNumber(perf.productivity),
                    overall_score:    toNumber(perf.overall_score) || calculatedScore,
                    rank:             toNumber(perf.rank) || toNumber(emp.rank) || 0,
                };
            }).sort((a, b) => (a.rank || 9999) - (b.rank || 9999));
        }

        function loadEmployees() {
            Promise.all([
                db.ref('employee-master').once('value'),
                db.ref('performance-data').once('value')
            ]).then(([empSnap, perfSnap]) => {
                allEmployees = buildEmployeeRows(empSnap.val() || {}, perfSnap.val() || {});
                renderAllScorecards();
                if (document.getElementById('scorecard').classList.contains('active')) {
                    searchEmployee(true);
                }

                // Live updates
                db.ref('performance-data').on('value', snap => {
                    db.ref('employee-master').once('value').then(es => {
                        allEmployees = buildEmployeeRows(es.val() || {}, snap.val() || {});
                        renderAllScorecards();
                        if (document.getElementById('scorecard').classList.contains('active')) {
                            searchEmployee(true);
                        }
                    });
                });
            }).catch(error => {
                showStatus(`Unable to load Firebase data: ${error.message}`, 'error');
            });
        }

        function searchEmployee(silent = false) {
            const id = document.getElementById('employeeId').value.trim().toUpperCase();
            
            if (!id) {
                showStatus('Please enter an Employee ID', 'error');
                return;
            }
            
            const emp = allEmployees.find(e => e.id.toUpperCase() === id);
            
            if (!emp) {
                showStatus('Employee not found', 'error');
                return;
            }
            
            // Display scorecard
            const score = emp.overall_score || 0;
            document.getElementById('displayName').textContent = emp.name;
            document.getElementById('displayId').textContent =
                `ID: ${emp.id}` + (emp.rank ? `  •  Rank #${emp.rank}` : '');
            document.getElementById('scoreOverall').textContent = score.toFixed(1) + '%';
            document.getElementById('scoreAttendance').textContent = emp.attendance.toFixed(1) + '%';
            document.getElementById('scoreKnowledge').textContent = emp.process_knowledge.toFixed(1) + '%';
            document.getElementById('scoreProductivity').textContent = Math.round(emp.productivity);
            
            document.getElementById('barOverall').style.width = Math.min(score, 100) + '%';
            document.getElementById('barAttendance').style.width = Math.min(emp.attendance, 100) + '%';
            document.getElementById('barKnowledge').style.width = Math.min(emp.process_knowledge, 100) + '%';
            
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('scorecard').classList.add('active');
            document.getElementById('allScorecards').style.display = 'none';
            document.getElementById('status').style.display = 'none';
        }
        
        function goBack() {
            document.getElementById('searchSection').style.display = 'block';
            document.getElementById('scorecard').classList.remove('active');
            document.getElementById('allScorecards').style.display = 'grid';
            document.getElementById('employeeId').value = '';
        }

        function renderAllScorecards() {
            const container = document.getElementById('allScorecards');
            if (!allEmployees.length) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = allEmployees.map(emp => {
                const score = emp.overall_score || 0;
                const rankText = emp.rank ? `<span style="font-size:11px;color:#667eea;font-weight:700;">Rank #${emp.rank}</span>` : '';
                return `
                    <div class="mini-scorecard" data-emp-id="${escapeHtml(emp.id)}">
                        <strong>${escapeHtml(emp.name)}</strong>
                        <span>ID: ${escapeHtml(emp.id)}</span>
                        ${rankText}
                        <div class="mini-score">${score.toFixed(1)}%</div>
                    </div>
                `;
            }).join('');

            // Safe event delegation — no inline onclick with user data
            container.querySelectorAll('.mini-scorecard').forEach(el => {
                el.addEventListener('click', () => openEmployee(el.dataset.empId));
            });
        }

        function openEmployee(id) {
            document.getElementById('employeeId').value = id;
            searchEmployee();
        }
        
        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = `status ${type}`;
        }
        
        loadEmployees();
    </script>
</body>
</html>
