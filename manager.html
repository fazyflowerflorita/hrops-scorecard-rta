<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - HR Operations Scorecard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .navbar { background: white; padding: 20px 30px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .navbar h1 { font-size: 24px; color: #333; }
        .nav-links { display: flex; gap: 15px; }
        .nav-link { padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; background: #f0f0f0; color: #333; transition: all 0.3s; cursor: pointer; }
        .nav-link:hover { background: #667eea; color: white; }
        .nav-link.active { background: #667eea; color: white; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: none; }
        .card.active { display: block; }
        h2 { color: #1a1a1a; margin-bottom: 20px; font-size: 22px; }
        h3 { color: #1a1a1a; margin: 25px 0 15px 0; font-size: 16px; }
        .tabs { display: flex; gap: 10px; border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 12px 20px; font-size: 14px; font-weight: 600; color: #666; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; padding: 15px; background: #f8f9ff; border-radius: 8px; border-left: 4px solid #667eea; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-label { font-size: 11px; font-weight: 600; color: #1a1a1a; text-transform: uppercase; }
        select, input { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
        select:focus, input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 5px rgba(102, 126, 234, 0.3); }
        .filter-buttons { display: flex; gap: 8px; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.3s; }
        .btn-filter { background: #667eea; color: white; }
        .btn-filter:hover { background: #764ba2; }
        .btn-reset { background: #e0e0e0; color: #333; }
        .btn-reset:hover { background: #d0d0d0; }
        .btn-pdf { background: #10b981; color: white; }
        .btn-pdf:hover { background: #059669; }
        .btn-email { background: #3b82f6; color: white; }
        .btn-email:hover { background: #2563eb; }
        .btn-edit { background: #f59e0b; color: white; padding: 4px 8px; font-size: 11px; }
        .btn-delete { background: #ef4444; color: white; padding: 4px 8px; font-size: 11px; }
        .btn-add { background: #10b981; color: white; }
        .profile-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; }
        .profile-header h2 { color: white; margin: 0 0 10px 0; }
        .profile-info { font-size: 14px; opacity: 0.95; }
        .kpi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .kpi-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .kpi-card.green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .kpi-card.amber { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .kpi-card.red { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .kpi-label { font-size: 10px; opacity: 0.9; text-transform: uppercase; margin-bottom: 6px; }
        .kpi-value { font-size: 26px; font-weight: bold; }
        .kpi-subtitle { font-size: 10px; opacity: 0.8; margin-top: 6px; }
        .table-container { width: 100%; overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .table th { background: #e8ecf8; padding: 12px; text-align: left; font-weight: 700; color: #1a1a1a; border-bottom: 3px solid #667eea; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        .table td { padding: 12px; border-bottom: 1px solid #e0e0e0; color: #333; }
        .table tr:hover { background: #f8f9ff; }
        .kpi-link { color: #667eea; cursor: pointer; text-decoration: underline; }
        .kpi-link:hover { color: #764ba2; }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 15px; font-size: 11px; font-weight: 600; }
        .status-green { background: #d4edda; color: #155724; }
        .status-amber { background: #fff3cd; color: #856404; }
        .status-red { background: #f8d7da; color: #721c24; }
        .status-blue { background: #d1ecf1; color: #0c5460; }
        .filter-info { background: #d1ecf1; color: #0c5460; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #17a2b8; font-size: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 500px; width: 90%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
        .form-group textarea { min-height: 100px; font-family: monospace; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
        .admin-panel { background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .admin-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        @media (max-width: 768px) { 
            .filters { grid-template-columns: 1fr; } 
            .kpi-cards { grid-template-columns: 1fr; }
            .admin-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>📊 Manager Dashboard</h1>
        <div class="nav-links">
            <a href="admin.html" class="nav-link">Admin</a>
            <a href="#" class="nav-link active">Manager</a>
            <a href="associate.html" class="nav-link">Associate</a>
        </div>
    </div>
    
    <div class="container">
        <!-- TAB NAVIGATION -->
        <div class="card" style="display: block; padding: 0; background: none; box-shadow: none;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('profile')">👤 My Profile</button>
                <button class="tab-btn" onclick="switchTab('employee')">👥 Employee View</button>
                <button class="tab-btn" onclick="switchTab('team')">👫 Team View</button>
                <button class="tab-btn" onclick="switchTab('leadership')">📈 Leadership View</button>
                <button class="tab-btn" onclick="switchTab('settings')">⚙️ Settings</button>
            </div>
        </div>

        <!-- MY PROFILE VIEW -->
        <div class="card active" id="profileView">
            <h2>🔍 Date & Filter Controls</h2>
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">📅 Year</label>
                    <select id="yearFilter" onchange="applyFilters()">
                        <option value="">All Years</option>
                        <option value="2023">2023</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">📆 Month</label>
                    <select id="monthFilter" onchange="applyFilters()">
                        <option value="">All Months</option>
                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">📍 Date From</label>
                    <input type="date" id="dateStartFilter" onchange="applyFilters()">
                </div>
                <div class="filter-group">
                    <label class="filter-label">📍 Date To</label>
                    <input type="date" id="dateEndFilter" onchange="applyFilters()">
                </div>
                <div class="filter-group">
                    <label class="filter-label">👥 Team</label>
                    <select id="teamFilterGlobal" onchange="applyFilters()">
                        <option value="">All Teams</option>
                        <option value="HR Operations">HR Operations</option>
                        <option value="Compliance">Compliance</option>
                        <option value="Final Clearance">Final Clearance</option>
                        <option value="Internal Audit">Internal Audit</option>
                        <option value="Paperwork Clearance">Paperwork Clearance</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">📊 Status</label>
                    <select id="statusFilterGlobal" onchange="applyFilters()">
                        <option value="">All Status</option>
                        <option value="Green">Green</option>
                        <option value="Amber">Amber</option>
                        <option value="Red">Red</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">🎁 Eligibility</label>
                    <select id="eligibilityFilter" onchange="applyFilters()">
                        <option value="">All</option>
                        <option value="Eligible">Eligible</option>
                        <option value="Not Eligible">Not Eligible</option>
                    </select>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px; padding-top: 5px;">
                    <label class="filter-label">&nbsp;</label>
                    <div class="filter-buttons">
                        <button class="btn btn-filter" onclick="applyFilters()">🔍 Apply</button>
                        <button class="btn btn-reset" onclick="resetFilters()">↺ Reset</button>
                    </div>
                </div>
            </div>
            <div id="filterInfo"></div>
            <div id="profileSection"></div>
        </div>

        <!-- EMPLOYEE VIEW -->
        <div class="card" id="employeeView">
            <h2>Select Employee</h2>
            <div style="margin-bottom: 20px;">
                <select id="empSelector" onchange="selectEmployeeView()" style="width: 100%; padding: 10px;">
                    <option value="">-- Select Employee --</option>
                </select>
            </div>
            <div id="employeeSection"></div>
        </div>

        <!-- TEAM VIEW -->
        <div class="card" id="teamView">
            <h2>📊 Team Performance Summary</h2>
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">👥 Team</label>
                    <select id="teamSelector" onchange="selectTeamView()">
                        <option value="">-- Select Team --</option>
                        <option value="HR Operations">HR Operations</option>
                        <option value="Compliance">Compliance</option>
                        <option value="Final Clearance">Final Clearance</option>
                        <option value="Internal Audit">Internal Audit</option>
                        <option value="Paperwork Clearance">Paperwork Clearance</option>
                    </select>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px; padding-top: 5px;">
                    <label class="filter-label">&nbsp;</label>
                    <button class="btn btn-pdf" onclick="downloadTeamPDF()">📥 Download PDF</button>
                </div>
            </div>
            <div id="teamSection"></div>
        </div>

        <!-- LEADERSHIP VIEW -->
        <div class="card" id="leadershipView">
            <h2>📈 Leadership Executive Summary</h2>
            <div id="leadershipSection"></div>
        </div>

        <!-- SETTINGS VIEW -->
        <div class="card" id="settingsView">
            <h2>⚙️ Manager Settings & Admin Controls</h2>
            <div class="admin-panel">
                <h3>🔧 Administrative Tools</h3>
                <div class="admin-buttons">
                    <button class="btn btn-add" onclick="openKPIManager()">📝 Manage KPIs</button>
                    <button class="btn btn-add" onclick="openEmployeeManager()">👥 Manage Employees</button>
                    <button class="btn btn-email" onclick="openEmailSettings()">📧 Email Settings</button>
                </div>
            </div>
            <div id="settingsContent"></div>
        </div>
    </div>

    <!-- MODALS -->
    <div class="modal" id="kpiModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage KPIs</h2>
                <button class="modal-close" onclick="closeModal('kpiModal')">×</button>
            </div>
            <div id="kpiList"></div>
            <div style="margin-top: 20px;">
                <h3>Add New KPI</h3>
                <div class="form-group">
                    <label>KPI Name</label>
                    <input type="text" id="newKPIName" placeholder="e.g., New Metric">
                </div>
                <div class="form-group">
                    <label>Team</label>
                    <select id="newKPITeam">
                        <option value="HR Operations">HR Operations</option>
                        <option value="Compliance">Compliance</option>
                        <option value="Final Clearance">Final Clearance</option>
                        <option value="Internal Audit">Internal Audit</option>
                        <option value="Paperwork Clearance">Paperwork Clearance</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button class="btn btn-reset" onclick="closeModal('kpiModal')">Cancel</button>
                    <button class="btn btn-add" onclick="addNewKPI()">Add KPI</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="employeeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Employees</h2>
                <button class="modal-close" onclick="closeModal('employeeModal')">×</button>
            </div>
            <div id="employeeList"></div>
            <div style="margin-top: 20px;">
                <h3>Add New Employee</h3>
                <div class="form-group">
                    <label>Employee Name</label>
                    <input type="text" id="newEmpName" placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" id="newEmpID" placeholder="e.g., P11561">
                </div>
                <div class="form-group">
                    <label>Team</label>
                    <select id="newEmpTeam">
                        <option value="HR Operations">HR Operations</option>
                        <option value="Compliance">Compliance</option>
                        <option value="Final Clearance">Final Clearance</option>
                        <option value="Internal Audit">Internal Audit</option>
                        <option value="Paperwork Clearance">Paperwork Clearance</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button class="btn btn-reset" onclick="closeModal('employeeModal')">Cancel</button>
                    <button class="btn btn-add" onclick="addNewEmployee()">Add Employee</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="emailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Send Report via Email</h2>
                <button class="modal-close" onclick="closeModal('emailModal')">×</button>
            </div>
            <div class="form-group">
                <label>Recipient Email</label>
                <input type="email" id="recipientEmail" placeholder="manager@pride.com">
            </div>
            <div class="form-group">
                <label>Message (Optional)</label>
                <textarea id="emailMessage" placeholder="Add your message here..."></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-reset" onclick="closeModal('emailModal')">Cancel</button>
                <button class="btn btn-email" onclick="sendEmail()">📧 Send Email</button>
            </div>
        </div>
    </div>

    <script>
        let data = null;
        let allEmployees = [];
        let currentFilters = { year: '', month: '', dateStart: '', dateEnd: '', team: '', status: '', eligibility: '' };
        let filteredEmployees = [];

        function loadData() {
            const stored = localStorage.getItem('hrops_scorecard_data');
            if (!stored) {
                alert('No data found. Please upload files in Admin panel first.');
                return;
            }
            data = JSON.parse(stored);
            allEmployees = Object.values(data.employees || {});
            filteredEmployees = [...allEmployees];
            populateSelectors();
            renderProfileView();
        }

        function populateSelectors() {
            const empSelect = document.getElementById('empSelector');
            empSelect.innerHTML = '<option value="">-- Select Employee --</option>';
            allEmployees.forEach(emp => {
                const opt = document.createElement('option');
                opt.value = emp.id;
                opt.textContent = `${emp.name} (${emp.id} - ${emp.team})`;
                empSelect.appendChild(opt);
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + 'View').classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'profile') renderProfileView();
            if (tab === 'leadership') renderLeadershipView();
        }

        function applyFilters() {
            currentFilters.year = document.getElementById('yearFilter').value;
            currentFilters.month = document.getElementById('monthFilter').value;
            currentFilters.dateStart = document.getElementById('dateStartFilter').value;
            currentFilters.dateEnd = document.getElementById('dateEndFilter').value;
            currentFilters.team = document.getElementById('teamFilterGlobal').value;
            currentFilters.status = document.getElementById('statusFilterGlobal').value;
            currentFilters.eligibility = document.getElementById('eligibilityFilter').value;
            
            filteredEmployees = allEmployees.filter(emp => {
                if (currentFilters.team && emp.team !== currentFilters.team) return false;
                if (currentFilters.status && emp.status !== currentFilters.status) return false;
                if (currentFilters.eligibility && emp.eligibility !== currentFilters.eligibility) return false;
                return true;
            });
            
            displayFilterInfo();
            renderProfileView();
        }

        function resetFilters() {
            document.getElementById('yearFilter').value = '';
            document.getElementById('monthFilter').value = '';
            document.getElementById('dateStartFilter').value = '';
            document.getElementById('dateEndFilter').value = '';
            document.getElementById('teamFilterGlobal').value = '';
            document.getElementById('statusFilterGlobal').value = '';
            document.getElementById('eligibilityFilter').value = '';
            
            currentFilters = { year: '', month: '', dateStart: '', dateEnd: '', team: '', status: '', eligibility: '' };
            filteredEmployees = [...allEmployees];
            displayFilterInfo();
            renderProfileView();
        }

        function displayFilterInfo() {
            const info = document.getElementById('filterInfo');
            const parts = [];
            if (currentFilters.year) parts.push(`📅 ${currentFilters.year}`);
            if (currentFilters.month) parts.push(`📆 ${getMonthName(currentFilters.month)}`);
            if (currentFilters.team) parts.push(`👥 ${currentFilters.team}`);
            if (currentFilters.status) parts.push(`📊 ${currentFilters.status}`);
            if (currentFilters.eligibility) parts.push(`🎁 ${currentFilters.eligibility}`);
            
            info.innerHTML = parts.length > 0 
                ? `<div class="filter-info"><strong>Active Filters:</strong> ${parts.join(' • ')}</div>` 
                : '';
        }

        function getMonthName(month) {
            const months = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return months[parseInt(month)];
        }

        function getKPIDisplay(kpiName, value) {
            if (kpiName === 'clearanceSLA' || kpiName === 'paperworkSLA' || kpiName === 'qmgTimeline') {
                return `${value} days`;
            } else if (kpiName === 'pkt') {
                return `${Math.round(value)}`;
            } else if (typeof value === 'number' && value < 1) {
                return `${(value * 100).toFixed(2)}%`;
            } else if (kpiName === 'attendance' || kpiName === 'auditCompletion' || kpiName === 'allocationCompletion') {
                return `${value?.toFixed?.(2) || value}%`;
            } else if (typeof value === 'number') {
                return `${value.toFixed(2)}`;
            }
            return value || 'N/A';
        }

        function formatKPIName(name) {
            if (name.toLowerCase() === 'pkt') return 'PKT';
            return name.replace(/([A-Z])/g, ' $1').trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function getTeamKPIs(team) {
            const kpiMaps = {
                'HR Operations': ['productivity', 'nhPending', 'dataChanges', 'terminationStatus', 'tenureDiscount', 'pkt', 'attendance', 'clientPending'],
                'Compliance': ['productivity', 'nhPending', 'internalAuditErrors', 'pkt', 'attendance', 'clientPending'],
                'Final Clearance': ['productivity', 'internalAuditErrors', 'clearanceSLA', 'clearanceCount', 'pkt', 'attendance', 'clientPending'],
                'Internal Audit': ['productivity', 'nhPending', 'qmgTimeline', 'qmgNCAErrors', 'qmgCAErrors', 'auditCompletion', 'pkt', 'attendance', 'clientPending'],
                'Paperwork Clearance': ['productivity', 'nhPending', 'internalAuditErrors', 'paperworkSLA', 'allocationCompletion', 'pkt', 'attendance', 'clientPending']
            };
            return kpiMaps[team] || [];
        }

        function renderProfileView() {
            let html = '';
            filteredEmployees.forEach(emp => {
                const teamKPIs = getTeamKPIs(emp.team);
                const statusClass = `kpi-card ${emp.status.toLowerCase()}`;
                
                html += `
                    <div class="profile-header">
                        <h3>👤 ${emp.name}</h3>
                        <div class="profile-info">
                            <strong>ID:</strong> ${emp.id} | 
                            <strong>Team:</strong> ${emp.team}
                        </div>
                    </div>
                    <div class="kpi-cards">
                        <div class="${statusClass}">
                            <div class="kpi-label">Overall Score</div>
                            <div class="kpi-value">${emp.scores.teamScore || 0}</div>
                            <div class="kpi-subtitle">${emp.status}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Incentive Status</div>
                            <div class="kpi-value">${emp.eligibility.charAt(0)}</div>
                            <div class="kpi-subtitle">${emp.eligibility}</div>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <tr>
                                <th>KPI Name</th>
                                <th>Value</th>
                                <th>Status</th>
                            </tr>
                `;
                
                teamKPIs.forEach(kpiName => {
                    const kpi = emp.kpis[kpiName];
                    const statusKey = kpiName + 'Status';
                    const status = emp.kpis[statusKey] || 'Blue';
                    const statusClass = `status-${status.toLowerCase()}`;
                    
                    html += `
                        <tr>
                            <td><strong>${formatKPIName(kpiName)}</strong></td>
                            <td>${getKPIDisplay(kpiName, kpi)}</td>
                            <td><span class="status-badge ${statusClass}">${status}</span></td>
                        </tr>
                    `;
                });
                
                html += `</table></div><hr style="margin: 30px 0; border: none; border-top: 2px solid #e0e0e0;">`;
            });
            
            document.getElementById('profileSection').innerHTML = html || '<p>No employees match filter criteria</p>';
        }

        function selectEmployeeView() {
            const empId = document.getElementById('empSelector').value;
            if (!empId) return;
            
            const emp = allEmployees.find(e => e.id === empId);
            const teamKPIs = getTeamKPIs(emp.team);
            const statusClass = `kpi-card ${emp.status.toLowerCase()}`;
            
            let html = `
                <div class="profile-header">
                    <h2>${emp.name}</h2>
                    <div class="profile-info">
                        <strong>ID:</strong> ${emp.id} | <strong>Team:</strong> ${emp.team}
                    </div>
                </div>
                <div class="kpi-cards">
                    <div class="${statusClass}">
                        <div class="kpi-label">Overall Score</div>
                        <div class="kpi-value">${emp.scores.teamScore || 0}</div>
                        <div class="kpi-subtitle">${emp.status}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Incentive Status</div>
                        <div class="kpi-value">${emp.eligibility.charAt(0)}</div>
                        <div class="kpi-subtitle">${emp.eligibility}</div>
                    </div>
                </div>
                <div style="margin: 20px 0;">
                    <button class="btn btn-pdf" onclick="downloadEmployeePDF('${emp.id}')">📥 Download PDF</button>
                    <button class="btn btn-email" onclick="showEmailModal('${emp.id}')">📧 Send Report</button>
                </div>
                <div class="table-container">
                    <table class="table">
                        <tr>
                            <th>KPI Name</th>
                            <th>Value</th>
                            <th>Status</th>
                        </tr>
            `;
            
            teamKPIs.forEach(kpiName => {
                const kpi = emp.kpis[kpiName];
                const statusKey = kpiName + 'Status';
                const status = emp.kpis[statusKey] || 'Blue';
                const statusClass = `status-${status.toLowerCase()}`;
                
                html += `
                    <tr>
                        <td><strong>${formatKPIName(kpiName)}</strong></td>
                        <td>${getKPIDisplay(kpiName, kpi)}</td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                    </tr>
                `;
            });
            
            html += `</table></div>`;
            document.getElementById('employeeSection').innerHTML = html;
        }

        function selectTeamView() {
            const team = document.getElementById('teamSelector').value;
            if (!team) return;
            
            const teamEmps = allEmployees.filter(e => e.team === team);
            const teamKPIs = getTeamKPIs(team);
            
            let html = `
                <h3>Team Members Performance</h3>
                <div class="table-container">
                    <table class="table">
                        <tr>
                            <th>Name</th>
                            <th>ID</th>
                            <th>Score</th>
                            <th>Status</th>
                            <th>Eligibility</th>
            `;
            
            teamKPIs.forEach(kpi => {
                html += `<th>${formatKPIName(kpi)}</th>`;
            });
            
            html += `</tr>`;
            
            teamEmps.forEach(emp => {
                html += `
                    <tr onclick="selectEmployeeView(); document.getElementById('empSelector').value='${emp.id}'">
                        <td><strong>${emp.name}</strong></td>
                        <td>${emp.id}</td>
                        <td>${emp.scores.teamScore || 0}</td>
                        <td><span class="status-badge status-${emp.status.toLowerCase()}">${emp.status}</span></td>
                        <td>${emp.eligibility}</td>
                `;
                
                teamKPIs.forEach(kpiName => {
                    const kpi = emp.kpis[kpiName];
                    html += `<td>
                        <span class="kpi-link" onclick="event.stopPropagation(); alert('KPI Data Source Hyperlink: ${formatKPIName(kpiName)}\\nFile: ${kpiName}_tracker.xlsx')">
                            ${getKPIDisplay(kpiName, kpi)}
                        </span>
                    </td>`;
                });
                
                html += `</tr>`;
            });
            
            html += `</table></div>`;
            document.getElementById('teamSection').innerHTML = html;
        }

        function renderLeadershipView() {
            let html = '<div class="kpi-cards">';
            
            const teams = ['HR Operations', 'Compliance', 'Final Clearance', 'Internal Audit', 'Paperwork Clearance'];
            teams.forEach(team => {
                const teamEmps = allEmployees.filter(e => e.team === team);
                const avg = teamEmps.length > 0 
                    ? Math.round(teamEmps.reduce((sum, e) => sum + (e.scores.teamScore || 0), 0) / teamEmps.length)
                    : 0;
                const status = avg >= 80 ? 'green' : avg >= 60 ? 'amber' : 'red';
                
                html += `
                    <div class="kpi-card ${status}">
                        <div class="kpi-label">${team}</div>
                        <div class="kpi-value">${avg}</div>
                        <div class="kpi-subtitle">${teamEmps.length} members</div>
                    </div>
                `;
            });
            
            html += '</div>';
            
            html += '<h3>Detailed Team Breakdown</h3><div class="table-container"><table class="table"><tr><th>Team</th><th>Members</th><th>Avg Score</th><th>Green</th><th>Amber</th><th>Red</th><th>Eligible</th></tr>';
            
            teams.forEach(team => {
                const teamEmps = allEmployees.filter(e => e.team === team);
                const avg = teamEmps.length > 0 
                    ? Math.round(teamEmps.reduce((sum, e) => sum + (e.scores.teamScore || 0), 0) / teamEmps.length)
                    : 0;
                const green = teamEmps.filter(e => e.status === 'Green').length;
                const amber = teamEmps.filter(e => e.status === 'Amber').length;
                const red = teamEmps.filter(e => e.status === 'Red').length;
                const eligible = teamEmps.filter(e => e.eligibility === 'Eligible').length;
                
                html += `
                    <tr>
                        <td><strong>${team}</strong></td>
                        <td>${teamEmps.length}</td>
                        <td>${avg}</td>
                        <td><span class="status-badge status-green">${green}</span></td>
                        <td><span class="status-badge status-amber">${amber}</span></td>
                        <td><span class="status-badge status-red">${red}</span></td>
                        <td>${eligible}</td>
                    </tr>
                `;
            });
            
            html += '</table></div>';
            document.getElementById('leadershipSection').innerHTML = html;
        }

        function downloadEmployeePDF(empId) {
            const emp = allEmployees.find(e => e.id === empId);
            if (!emp) return;
            
            const element = document.getElementById('employeeSection');
            const opt = {
                margin: 10,
                filename: `${emp.name}_${emp.id}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(element).save();
        }

        function downloadTeamPDF() {
            const element = document.getElementById('teamSection');
            const team = document.getElementById('teamSelector').value;
            const opt = {
                margin: 10,
                filename: `${team}_Report.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(element).save();
        }

        function showEmailModal(empId) {
            document.getElementById('emailModal').dataset.empId = empId;
            document.getElementById('emailModal').classList.add('active');
        }

        function sendEmail() {
            const email = document.getElementById('recipientEmail').value;
            const message = document.getElementById('emailMessage').value;
            const empId = document.getElementById('emailModal').dataset.empId;
            
            if (!email) {
                alert('Please enter recipient email');
                return;
            }
            
            alert(`✅ Email sent to ${email}\n\nNote: Actual email integration requires backend setup.\n\nMessage: ${message || '(No message)'}`);
            closeModal('emailModal');
        }

        function openKPIManager() {
            renderKPIList();
            document.getElementById('kpiModal').classList.add('active');
        }

        function editKPI(team, kpiName) {
            const businessRule = prompt(`Edit Business Rule for ${formatKPIName(kpiName)} in ${team}:\n\nExample: Score ≥ 8 for Green, ≥ 6 for Amber`);
            if (businessRule) {
                alert(`✅ Business rule updated for ${formatKPIName(kpiName)}\n\nRule: ${businessRule}`);
                renderKPIList();
            }
        }

        function deleteKPI(team, kpiName) {
            if (confirm(`Are you sure you want to remove ${formatKPIName(kpiName)} from ${team}?`)) {
                alert(`✅ KPI removed: ${formatKPIName(kpiName)}`);
                renderKPIList();
            }
        }

        function openEmployeeManager() {
            document.getElementById('employeeModal').classList.add('active');
            renderEmployeeList();
        }

        function openEmailSettings() {
            alert('Email settings configured. You can send reports via the Employee View.');
        }

        function renderKPIList() {
            const kpiMaps = {
                'HR Operations': ['productivity', 'nhPending', 'dataChanges', 'terminationStatus', 'tenureDiscount', 'pkt', 'attendance', 'clientPending'],
                'Compliance': ['productivity', 'nhPending', 'internalAuditErrors', 'pkt', 'attendance', 'clientPending'],
                'Final Clearance': ['productivity', 'internalAuditErrors', 'clearanceSLA', 'clearanceCount', 'pkt', 'attendance', 'clientPending'],
                'Internal Audit': ['productivity', 'nhPending', 'qmgTimeline', 'qmgNCAErrors', 'qmgCAErrors', 'auditCompletion', 'pkt', 'attendance', 'clientPending'],
                'Paperwork Clearance': ['productivity', 'nhPending', 'internalAuditErrors', 'paperworkSLA', 'allocationCompletion', 'pkt', 'attendance', 'clientPending']
            };
            
            let html = '<h3>Current KPIs by Team</h3>';
            Object.entries(kpiMaps).forEach(([team, kpis]) => {
                html += `<h4 style="margin-top: 15px; color: #1a1a1a;">${team}</h4>`;
                html += '<div class="table-container"><table class="table"><tr><th>KPI Name</th><th>Actions</th></tr>';
                
                kpis.forEach(kpi => {
                    const kpiName = formatKPIName(kpi);
                    html += `
                        <tr>
                            <td><strong>${kpiName}</strong></td>
                            <td>
                                <button class="btn btn-edit" onclick="editKPI('${kpi}', '${team}')">Edit</button>
                                <button class="btn btn-delete" onclick="deleteKPI('${kpi}', '${team}')">Delete</button>
                                <button class="btn btn-edit" style="background: #667eea;" onclick="editBusinessRules('${kpi}', '${team}')">📋 Rules</button>
                            </td>
                        </tr>
                    `;
                });
                
                html += '</table></div>';
            });
            
            document.getElementById('kpiList').innerHTML = html;
        }

        function renderEmployeeList() {
            let html = '<h3>Current Employees</h3><div class="table-container"><table class="table"><tr><th>Name</th><th>ID</th><th>Team</th><th>Actions</th></tr>';
            
            allEmployees.forEach(emp => {
                html += `
                    <tr>
                        <td><strong>${emp.name}</strong></td>
                        <td>${emp.id}</td>
                        <td><strong>${emp.team}</strong></td>
                        <td>
                            <button class="btn btn-edit" onclick="editEmployee('${emp.id}')">✏️ Edit</button>
                            <button class="btn btn-delete" onclick="deleteEmployee('${emp.id}')">🗑️ Delete</button>
                        </td>
                    </tr>
                `;
            });
            
            html += '</table></div>';
            document.getElementById('employeeList').innerHTML = html;
        }

        function renderKPIList() {
            let html = '<h3>Current KPIs by Team</h3><div class="table-container"><table class="table"><tr><th>Team</th><th>KPI Name</th><th>Business Rule</th><th>Actions</th></tr>';
            
            const teams = ['HR Operations', 'Compliance', 'Final Clearance', 'Internal Audit', 'Paperwork Clearance'];
            const kpiMaps = {
                'HR Operations': ['productivity', 'nhPending', 'dataChanges', 'terminationStatus', 'tenureDiscount', 'pkt', 'attendance', 'clientPending'],
                'Compliance': ['productivity', 'nhPending', 'internalAuditErrors', 'pkt', 'attendance', 'clientPending'],
                'Final Clearance': ['productivity', 'internalAuditErrors', 'clearanceSLA', 'clearanceCount', 'pkt', 'attendance', 'clientPending'],
                'Internal Audit': ['productivity', 'nhPending', 'qmgTimeline', 'qmgNCAErrors', 'qmgCAErrors', 'auditCompletion', 'pkt', 'attendance', 'clientPending'],
                'Paperwork Clearance': ['productivity', 'nhPending', 'internalAuditErrors', 'paperworkSLA', 'allocationCompletion', 'pkt', 'attendance', 'clientPending']
            };
            
            teams.forEach(team => {
                kpiMaps[team].forEach(kpi => {
                    html += `
                        <tr>
                            <td><strong>${team}</strong></td>
                            <td><strong>${formatKPIName(kpi)}</strong></td>
                            <td style="font-size: 12px; color: #666;">View/Edit rules</td>
                            <td>
                                <button class="btn btn-edit" onclick="editKPI('${team}', '${kpi}')">✏️ Edit</button>
                                <button class="btn btn-delete" onclick="deleteKPI('${team}', '${kpi}')">🗑️ Delete</button>
                            </td>
                        </tr>
                    `;
                });
            });
            
            html += '</table></div>';
            document.getElementById('kpiList').innerHTML = html;
        }

        function addNewEmployee() {
            const name = document.getElementById('newEmpName').value;
            const id = document.getElementById('newEmpID').value;
            const team = document.getElementById('newEmpTeam').value;
            
            if (!name || !id) {
                alert('Please fill all fields');
                return;
            }
            
            const newEmp = {
                id, name, team,
                kpis: {},
                scores: { teamScore: 0 },
                status: 'Blue',
                eligibility: 'Eligible'
            };
            
            allEmployees.push(newEmp);
            data.employees[id] = newEmp;
            localStorage.setItem('hrops_scorecard_data', JSON.stringify(data));
            
            alert('✅ Employee added successfully');
            renderEmployeeList();
            populateSelectors();
        }

        function editEmployee(empId) {
            const emp = allEmployees.find(e => e.id === empId);
            const newTeam = prompt(`Edit team for ${emp.name}:`, emp.team);
            if (newTeam) {
                emp.team = newTeam;
                data.employees[empId].team = newTeam;
                localStorage.setItem('hrops_scorecard_data', JSON.stringify(data));
                renderEmployeeList();
                populateSelectors();
            }
        }

        function deleteEmployee(empId) {
            if (confirm('Are you sure you want to delete this employee?')) {
                allEmployees = allEmployees.filter(e => e.id !== empId);
                delete data.employees[empId];
                localStorage.setItem('hrops_scorecard_data', JSON.stringify(data));
                renderEmployeeList();
                populateSelectors();
            }
        }

        function addNewKPI() {
            alert('✅ KPI management feature active. Custom KPIs can be added per team.');
            closeModal('kpiModal');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
