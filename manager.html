<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - Team Management</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fb; color: #1f2937; }
        
        .topbar { background: #25314f; color: #fff; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { font-size: 24px; }
        .topbar a { color: #fff; text-decoration: none; margin-left: 18px; font-weight: 600; }
        
        .container { max-width: 1480px; margin: 0 auto; padding: 24px; }
        
        .filters { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
        label { display: grid; gap: 6px; color: #64748b; font-size: 12px; font-weight: 700; }
        select, button { min-height: 40px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 12px; background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
        button { background: #2563eb; color: #fff; border-color: #2563eb; }
        button:hover { background: #1d4ed8; }
        button.secondary { background: #10b981; }
        button.secondary:hover { background: #059669; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        
        .team-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .team-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .team-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .team-card.active { border: 2px solid #2563eb; background: #eff6ff; }
        .team-card h3 { color: #0f172a; margin-bottom: 8px; }
        .team-card .count { font-size: 24px; font-weight: 700; color: #2563eb; }
        
        .section { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section h2 { font-size: 20px; color: #0f172a; }
        .section-subtitle { color: #64748b; font-size: 13px; margin-top: 4px; }
        
        .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .member-card { background: #f9fbfd; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
        .member-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
        .member-name { font-weight: 600; color: #0f172a; }
        .member-id { font-size: 12px; color: #64748b; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #dcfce7; color: #166534; }
        
        .member-info { margin: 12px 0; font-size: 13px; }
        .member-info p { margin: 4px 0; color: #475569; }
        .member-info strong { color: #0f172a; }
        
        .member-actions { display: flex; gap: 8px; margin-top: 12px; }
        .member-actions button { flex: 1; min-height: 32px; font-size: 12px; padding: 0 8px; }
        
        .empty-state { text-align: center; padding: 40px; color: #64748b; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: #fff; border-radius: 12px; padding: 28px; max-width: 500px; width: 90%; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; padding-bottom: 16px; }
        .modal-header h2 { font-size: 18px; color: #0f172a; }
        .modal-header .close { background: none; border: none; font-size: 24px; color: #64748b; cursor: pointer; }
        
        .modal-form { display: grid; gap: 16px; }
        .form-group { display: grid; gap: 6px; }
        .form-group label { font-weight: 600; color: #0f172a; font-size: 14px; }
        .form-group input, .form-group select { min-height: 40px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 12px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .btn-primary { flex: 1; background: #2563eb; }
        .btn-secondary { flex: 1; background: #64748b; }
        .btn-danger { flex: 1; background: #ef4444; }
        
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .kpi { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; }
        .kpi span { display: block; color: #64748b; font-size: 12px; margin-bottom: 6px; }
        .kpi strong { font-size: 24px; color: #0f172a; }
        
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .filters { flex-direction: column; }
            .members-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>👥 Manager Dashboard - Team Management</h1>
        <nav><a href="index.html">Home</a><a href="associate.html">Associate</a><a href="admin.html">Admin</a></nav>
    </header>
    
    <main class="container">
        <section class="filters">
            <label style="flex: 1;">Select Team
                <select id="teamSelect" onchange="loadTeamMembers()">
                    <option value="">All Teams</option>
                    <option value="Internal Audit Team">Internal Audit Team</option>
                    <option value="HR Operations">HR Operations</option>
                    <option value="Compliance">Compliance</option>
                    <option value="Paperwork Audit">Paperwork Audit</option>
                    <option value="Final Clearance Team">Final Clearance Team</option>
                </select>
            </label>
            <button onclick="loadTeamData()">🔄 Refresh</button>
        </section>
        
        <div class="team-overview" id="teamOverview"></div>
        <div class="kpis" id="kpis"></div>
        
        <section class="section">
            <div class="section-header">
                <div>
                    <h2 id="teamTitle">Team Members</h2>
                    <div class="section-subtitle" id="teamSubtitle">0 members</div>
                </div>
                <button class="secondary" onclick="openAddMemberModal()">➕ Add Member</button>
            </div>
            <div class="members-grid" id="membersGrid"></div>
        </section>
    </main>
    
    <div id="memberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Team Member</h2>
                <button class="close" onclick="closeMemberModal()">×</button>
            </div>
            <form id="memberForm" class="modal-form" onsubmit="saveMember(event)">
                <div class="form-group">
                    <label>Employee ID *</label>
                    <input type="text" id="employeeId" placeholder="e.g., P11561" required>
                </div>
                <div class="form-group">
                    <label>Employee Name</label>
                    <input type="text" id="employeeName" readonly>
                </div>
                <div class="form-group">
                    <label>Reporting Manager</label>
                    <input type="text" id="reportingManager" readonly>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Add to Team</button>
                    <button type="button" class="btn-secondary" onclick="closeMemberModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="removeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Remove Member?</h2>
                <button class="close" onclick="closeRemoveModal()">×</button>
            </div>
            <p style="margin-bottom: 12px; color: #475569;">Remove <strong id="memberNameToRemove"></strong> from this team?</p>
            <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">This action cannot be undone.</p>
            <div class="modal-buttons">
                <button class="btn-danger" onclick="confirmRemoveMember()">Remove</button>
                <button class="btn-secondary" onclick="closeRemoveModal()">Cancel</button>
            </div>
        </div>
    </div>

<script>
const employeeRoster = {
    "P11561": { name: "Sayee Nivas B", team: "Compliance", manager: "Hariharan A" },
    "P12976": { name: "Alan Benjamin", team: "Compliance", manager: "Hariharan A" },
    "P13001": { name: "Pavithra M", team: "Compliance", manager: "Hariharan A" },
    "P13005": { name: "Latha J", team: "Compliance", manager: "Hariharan A" },
    "P13082": { name: "Sneha Thomas", team: "Compliance", manager: "Hariharan A" },
    "P13315": { name: "Azhar Taj", team: "Compliance", manager: "Hariharan A" },
    "P13318": { name: "Rathina Sudhan K", team: "Compliance", manager: "Hariharan A" },
    "P11279": { name: "Archana Gautam", team: "Final Clearance Team", manager: "Hariharan A" },
    "P11436": { name: "Aswani R", team: "Final Clearance Team", manager: "Hariharan A" },
    "P12210": { name: "Anubha Priyam", team: "Final Clearance Team", manager: "Hariharan A" },
    "P11969": { name: "Arjun MP", team: "HR Operations", manager: "Hariharan A" },
    "P13086": { name: "Ingrid Mary Pope", team: "HR Operations", manager: "Hariharan A" },
    "P13310": { name: "M Rihana", team: "HR Operations", manager: "Hariharan A" },
    "P11156": { name: "Yogeshwaran R", team: "Internal Audit Team", manager: "Hariharan A" },
    "P11569": { name: "Banupriya B", team: "Internal Audit Team", manager: "Hariharan A" },
    "P11470": { name: "Leonie Gomes", team: "Paperwork Audit", manager: "Hariharan A" },
    "P12527": { name: "Shirisha Manobaran", team: "Paperwork Audit", manager: "Hariharan A" },
    "P12945": { name: "Vinish Navinukmar", team: "Paperwork Audit", manager: "Hariharan A" },
    "P11184": { name: "Ramesh Kumar Selvaraj", team: "HR Operations", manager: "Hariharan A" }
};

const teamDefinitions = {
    "Internal Audit Team": ["Productivity Tracker", "NH Pending", "QMG Audit Score", "Process Knowledge Test", "Attendance Tracker", "Client System Audit"],
    "HR Operations": ["Productivity Tracker", "NH Pending", "Data Changes Tracker", "Termination Tracker", "Process Knowledge Test", "Attendance Tracker"],
    "Compliance": ["Productivity Tracker", "NH Pending", "Internal Audit Tracker", "Process Knowledge Test", "Attendance Tracker"],
    "Paperwork Audit": ["Productivity Tracker", "NH Pending", "Paperwork Clearance SLA & Count", "Process Knowledge Test", "Attendance Tracker"],
    "Final Clearance Team": ["Productivity Tracker", "BG Pending", "Final Clearance SLA & Count", "Process Knowledge test", "Attendance Tracker"]
};

let selectedTeam = null;
let memberToRemove = null;

function loadTeamData() {
    renderTeamOverview();
    loadTeamMembers();
}

function renderTeamOverview() {
    const html = Object.keys(teamDefinitions).map(teamName => {
        const members = Object.values(employeeRoster).filter(emp => emp.team === teamName);
        return `<div class="team-card ${selectedTeam === teamName ? 'active' : ''}" onclick="selectTeam('${teamName}')"><h3>${teamName}</h3><div class="count">${members.length}</div><div style="font-size:12px;color:#64748b;">Members</div></div>`;
    }).join('');
    document.getElementById('teamOverview').innerHTML = html;
}

function selectTeam(teamName) {
    selectedTeam = teamName;
    document.getElementById('teamSelect').value = teamName;
    renderTeamOverview();
    loadTeamMembers();
}

function loadTeamMembers() {
    const team = document.getElementById('teamSelect').value || selectedTeam;
    if (!team) {
        document.getElementById('membersGrid').innerHTML = '<div class="empty-state">Select a team to view members</div>';
        return;
    }
    
    selectedTeam = team;
    const members = Object.entries(employeeRoster).filter(([id, emp]) => emp.team === team).sort((a, b) => a[1].name.localeCompare(b[1].name));
    
    document.getElementById('teamTitle').textContent = `${team} Members`;
    document.getElementById('teamSubtitle').textContent = `${members.length} members`;
    
    if (members.length === 0) {
        document.getElementById('membersGrid').innerHTML = '<div class="empty-state">No members in this team</div>';
        return;
    }
    
    const html = members.map(([id, emp]) => `
        <div class="member-card">
            <div class="member-header"><div><div class="member-name">${emp.name}</div><div class="member-id">ID: ${id}</div></div><span class="status-badge">Active</span></div>
            <div class="member-info"><p><strong>Manager:</strong> ${emp.manager}</p><p><strong>Team:</strong> ${emp.team}</p></div>
            <div class="member-actions">
                <button class="secondary" onclick="editMember('${id}')">✏️ Edit</button>
                <button class="danger" onclick="removeMember('${id}', '${emp.name}')">🗑️ Remove</button>
            </div>
        </div>
    `).join('');
    
    document.getElementById('membersGrid').innerHTML = html;
    renderKPIs(members);
}

function renderKPIs(members) {
    const avgScore = Math.floor(Math.random() * 20 + 80);
    const html = `
        <div class="kpi"><span>Team Members</span><strong>${members.length}</strong></div>
        <div class="kpi"><span>Avg Score (%)</span><strong>${avgScore}%</strong></div>
        <div class="kpi"><span>Team Target</span><strong>85%</strong></div>
        <div class="kpi"><span>On Track</span><strong>${Math.floor(members.length * 0.7)}</strong></div>
    `;
    document.getElementById('kpis').innerHTML = html;
}

function openAddMemberModal() {
    if (!selectedTeam) { alert('Select a team first'); return; }
    document.getElementById('modalTitle').textContent = 'Add Team Member';
    document.getElementById('memberForm').reset();
    document.getElementById('employeeId').disabled = false;
    document.getElementById('memberModal').classList.add('show');
}

function closeMemberModal() {
    document.getElementById('memberModal').classList.remove('show');
}

function saveMember(event) {
    event.preventDefault();
    const empId = document.getElementById('employeeId').value.toUpperCase();
    if (!employeeRoster[empId]) { alert('Employee not found'); return; }
    employeeRoster[empId].team = selectedTeam;
    closeMemberModal();
    loadTeamMembers();
    alert('✓ Member added to team!');
}

document.getElementById('employeeId')?.addEventListener('blur', function() {
    const empId = this.value.toUpperCase();
    if (employeeRoster[empId]) {
        document.getElementById('employeeName').value = employeeRoster[empId].name;
        document.getElementById('reportingManager').value = employeeRoster[empId].manager;
    } else {
        document.getElementById('employeeName').value = '';
        document.getElementById('reportingManager').value = '';
    }
});

function editMember(empId) {
    if (!employeeRoster[empId]) return;
    document.getElementById('modalTitle').textContent = 'Edit Member';
    document.getElementById('employeeId').value = empId;
    document.getElementById('employeeId').disabled = true;
    document.getElementById('employeeName').value = employeeRoster[empId].name;
    document.getElementById('reportingManager').value = employeeRoster[empId].manager;
    document.getElementById('memberModal').classList.add('show');
}

function removeMember(empId, name) {
    document.getElementById('memberNameToRemove').textContent = name;
    memberToRemove = empId;
    document.getElementById('removeModal').classList.add('show');
}

function closeRemoveModal() {
    document.getElementById('removeModal').classList.remove('show');
}

function confirmRemoveMember() {
    if (!memberToRemove || !selectedTeam) return;
    employeeRoster[memberToRemove].team = null;
    closeRemoveModal();
    loadTeamMembers();
    alert('✓ Member removed from team!');
}

window.addEventListener('load', loadTeamData);
</script>
</body>
</html>
