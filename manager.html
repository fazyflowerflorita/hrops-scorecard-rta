<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - Real-Time</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
        }
        
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .navbar h1 {
            font-size: 24px;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-weight: 600;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        
        .navbar a:hover {
            opacity: 1;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .status-bar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-text {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .employee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .employee-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .employee-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        
        .employee-name {
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
            font-size: 15px;
        }
        
        .employee-id {
            font-size: 12px;
            color: #999;
            margin-bottom: 15px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }
        
        .metric-label {
            color: #666;
        }
        
        .metric-value {
            font-weight: 700;
            color: #667eea;
        }
        
        .metric-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
        }
        
        .metric-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 18px;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .controls input, .controls select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .controls button {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        @media (max-width: 768px) {
            .employee-grid {
                grid-template-columns: 1fr;
            }
            
            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>👥 Manager Dashboard</h1>
        <div>
            <a href="index.html">← Home</a>
            <a href="admin-upload.html">Admin Upload</a>
            <a href="associate.html">Associate</a>
        </div>
    </div>
    
    <div class="container">
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot"></span>
                <span class="status-text">Live - Real-time Updates</span>
            </div>
            <div class="status-item">
                <span class="status-text" id="employeeCount">Loading...</span>
            </div>
            <div class="status-item">
                <span class="status-text" id="lastUpdate">Waiting for data...</span>
            </div>
        </div>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search employee..." onkeyup="filterEmployees()" style="flex: 1; min-width: 200px;">
            <button onclick="refreshData()">🔄 Refresh</button>
        </div>
        
        <div id="content">
            <div class="loading">⏳ Waiting for data from Firebase...</div>
        </div>
    </div>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD_ToRRVy18YjH_V0M67DZ9Pd6LcSqDQqg",
            authDomain: "hrops-scorecard---rta.firebaseapp.com",
            projectId: "hrops-scorecard---rta",
            databaseURL: "https://hrops-scorecard---rta.firebaseio.com",
            storageBucket: "hrops-scorecard---rta.firebasestorage.app",
            messagingSenderId: "127519107306",
            appId: "1:127519107306:web:61683e0eb03874b0a94f93",
            measurementId: "G-K5H5SV6QQE"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let allEmployees = [];
        
        // Real-time listener
        function setupRealtimeListener() {
            db.ref('employee-scores').on('value', (snapshot) => {
                const data = snapshot.val() || {};
                
                allEmployees = [];
                for (const empId in data) {
                    const emp = data[empId];
                    allEmployees.push({
                        empId: empId,
                        attendance: emp.attendance || 0,
                        process_knowledge: emp.process_knowledge || 0,
                        productivity: emp.productivity || 0,
                        audit_score: emp.audit_score || 0,
                        paperwork: emp.paperwork || 0,
                        nh_pending: emp.nh_pending || 0,
                        lastUpdated: emp.lastUpdated || ''
                    });
                }
                
                renderEmployees();
                updateStatus();
            });
        }
        
        function updateStatus() {
            document.getElementById('employeeCount').textContent = `${allEmployees.length} employees loaded`;
            document.getElementById('lastUpdate').textContent = `Updated: ${new Date().toLocaleTimeString()}`;
        }
        
        function filterEmployees() {
            renderEmployees();
        }
        
        function renderEmployees() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allEmployees.filter(emp => 
                emp.empId.toLowerCase().includes(searchTerm)
            );
            
            if (filtered.length === 0) {
                document.getElementById('content').innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <p>No employees found. Upload Excel files in Admin Panel.</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="employee-grid">';
            
            filtered.forEach(emp => {
                const overallScore = ((emp.attendance || 0) + (emp.process_knowledge || 0)) / 2;
                
                html += `
                    <div class="employee-card">
                        <div class="employee-name">${emp.empId}</div>
                        <div class="employee-id">ID: ${emp.empId}</div>
                        
                        <div class="metric">
                            <span class="metric-label">Overall</span>
                            <span class="metric-value">${overallScore.toFixed(1)}%</span>
                        </div>
                        <div class="metric-bar">
                            <div class="metric-bar-fill" style="width: ${Math.min(overallScore, 100)}%"></div>
                        </div>
                        
                        ${emp.attendance > 0 ? `
                        <div class="metric">
                            <span class="metric-label">Attendance</span>
                            <span class="metric-value">${emp.attendance.toFixed(1)}%</span>
                        </div>
                        ` : ''}
                        
                        ${emp.process_knowledge > 0 ? `
                        <div class="metric">
                            <span class="metric-label">Knowledge</span>
                            <span class="metric-value">${emp.process_knowledge.toFixed(1)}%</span>
                        </div>
                        ` : ''}
                        
                        ${emp.productivity > 0 ? `
                        <div class="metric">
                            <span class="metric-label">Productivity</span>
                            <span class="metric-value">${Math.round(emp.productivity)}</span>
                        </div>
                        ` : ''}
                        
                        ${emp.audit_score > 0 ? `
                        <div class="metric">
                            <span class="metric-label">Audit Score</span>
                            <span class="metric-value">${emp.audit_score.toFixed(1)}%</span>
                        </div>
                        ` : ''}
                    </div>
                `;
            });
            
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }
        
        function refreshData() {
            updateStatus();
        }
        
        setupRealtimeListener();
    </script>
</body>
</html>
