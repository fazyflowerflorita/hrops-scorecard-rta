<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - HR Operations Scorecard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
        }
        
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .navbar h1 {
            font-size: 24px;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-weight: 600;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        
        .navbar a:hover {
            opacity: 1;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filters select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            background: white;
        }
        
        .filters button {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filters button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .team-section {
            margin-bottom: 40px;
        }
        
        .team-header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .team-header h2 {
            color: #667eea;
            font-size: 18px;
        }
        
        .team-header .count {
            background: #f0f4ff;
            padding: 6px 12px;
            border-radius: 20px;
            color: #667eea;
            font-weight: 600;
            font-size: 12px;
        }
        
        .employees {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .employee-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }
        
        .employee-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        
        .employee-name {
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
            font-size: 15px;
        }
        
        .employee-id {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
        }
        
        .score-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        .score-label {
            color: #666;
        }
        
        .score-value {
            font-weight: 700;
            color: #667eea;
            font-size: 16px;
        }
        
        .score-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            margin-top: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .score-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 18px;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .employees {
                grid-template-columns: 1fr;
            }
            
            .filters {
                flex-direction: column;
            }
            
            .filters select, .filters button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>👥 Manager Dashboard</h1>
        <div>
            <a href="index.html">← Home</a>
            <a href="associate.html">Associate</a>
            <a href="admin.html">Admin</a>
        </div>
    </div>
    
    <div class="container">
        <div class="filters">
            <select id="teamFilter" onchange="filterTeam()">
                <option value="">All Teams</option>
                <option value="Compliance">Compliance</option>
                <option value="Final Clearance Team">Final Clearance Team</option>
                <option value="HR Operations">HR Operations</option>
                <option value="Internal Audit Team">Internal Audit Team</option>
                <option value="Paperwork Audit">Paperwork Audit</option>
                <option value="MSD Data Management">MSD Data Management</option>
                <option value="Requisitions and Submissions">Requisitions and Submissions</option>
            </select>
            <button onclick="refreshData()">🔄 Refresh Data</button>
        </div>
        
        <div id="content">
            <div class="loading">⏳ Loading team data from Firebase...</div>
        </div>
    </div>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD_ToRRVy18YjH_V0M67DZ9Pd6LcSqDQqg",
            authDomain: "hrops-scorecard---rta.firebaseapp.com",
            projectId: "hrops-scorecard---rta",
            databaseURL: "https://hrops-scorecard---rta.firebaseio.com",
            storageBucket: "hrops-scorecard---rta.firebasestorage.app",
            messagingSenderId: "127519107306",
            appId: "1:127519107306:web:61683e0eb03874b0a94f93",
            measurementId: "G-K5H5SV6QQE"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let allEmployees = [];
        
        function loadData() {
            db.ref('employee-master').once('value', snap => {
                const emps = snap.val() || {};
                
                db.ref('performance-data').once('value', perfSnap => {
                    const perfs = perfSnap.val() || {};
                    
                    db.ref('employee-module-data').once('value', altSnap => {
                        const alts = altSnap.val() || {};
                        
                        allEmployees = [];
                        
                        for (const id in emps) {
                            const emp = emps[id];
                            const perf = perfs[id] || alts[id] || {};
                            
                            allEmployees.push({
                                id: id,
                                name: emp.name || '',
                                team: emp.team || 'Unassigned',
                                manager: emp.manager || '',
                                attendance: perf.attendance || 0,
                                process_knowledge: perf.process_knowledge || 0,
                                productivity: perf.productivity || 0,
                                overall_score: perf.overall_score || ((perf.attendance || 0) + (perf.process_knowledge || 0)) / 2
                            });
                        }
                        
                        renderTeams();
                    });
                });
            });
        }
        
        function filterTeam() {
            renderTeams();
        }
        
        function refreshData() {
            loadData();
        }
        
        function renderTeams() {
            const filter = document.getElementById('teamFilter').value;
            const filtered = filter ? allEmployees.filter(e => e.team === filter) : allEmployees;
            
            if (filtered.length === 0) {
                document.getElementById('content').innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>No employee data found. Make sure the Python script is running.</p></div>';
                return;
            }
            
            // Group by team
            const teams = {};
            filtered.forEach(emp => {
                if (!teams[emp.team]) teams[emp.team] = [];
                teams[emp.team].push(emp);
            });
            
            let html = '';
            for (const team in teams) {
                html += `
                    <div class="team-section">
                        <div class="team-header">
                            <h2>👥 ${team}</h2>
                            <span class="count">${teams[team].length} employees</span>
                        </div>
                        <div class="employees">
                `;
                
                teams[team].forEach(emp => {
                    const score = emp.overall_score || 0;
                    html += `
                        <div class="employee-card">
                            <div class="employee-name">${emp.name}</div>
                            <div class="employee-id">ID: ${emp.id}</div>
                            
                            <div class="score-line">
                                <span class="score-label">Overall Score</span>
                                <span class="score-value">${score.toFixed(1)}%</span>
                            </div>
                            <div class="score-bar">
                                <div class="score-bar-fill" style="width: ${Math.min(score, 100)}%"></div>
                            </div>
                            
                            <div class="score-line">
                                <span class="score-label">Attendance</span>
                                <span class="score-value">${emp.attendance.toFixed(1)}%</span>
                            </div>
                            
                            <div class="score-line">
                                <span class="score-label">Process Knowledge</span>
                                <span class="score-value">${emp.process_knowledge.toFixed(1)}%</span>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            document.getElementById('content').innerHTML = html;
        }
        
        loadData();
        setInterval(loadData, 10000); // Refresh every 10 seconds
    </script>
</body>
</html>
