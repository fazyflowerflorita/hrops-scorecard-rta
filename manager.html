<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - HR Ops Scorecard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f7fb; color: #1f2937; }
        .topbar { background: #25314f; color: #fff; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { font-size: 24px; }
        .topbar a { color: #fff; text-decoration: none; margin-left: 18px; font-weight: 600; }
        .container { max-width: 1480px; margin: 0 auto; padding: 24px; }
        .filters, .section { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; margin-bottom: 18px; box-shadow: 0 4px 16px rgba(15,23,42,.05); }
        .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
        label { display: grid; gap: 6px; color: #64748b; font-size: 12px; font-weight: 700; }
        select, button { min-height: 40px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 12px; background: #fff; font-size: 14px; }
        button { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        button:hover { background: #1d4ed8; }
        button.secondary { background: #10b981; border-color: #10b981; }
        button.secondary:hover { background: #059669; }
        button.danger { background: #ef4444; border-color: #ef4444; }
        button.danger:hover { background: #dc2626; }
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
        .kpi { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; box-shadow: 0 4px 16px rgba(15,23,42,.05); }
        .kpi span { display: block; color: #64748b; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
        .kpi strong { font-size: 28px; color: #0f172a; }
        .section h2 { font-size: 18px; margin-bottom: 12px; color: #25314f; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .grid-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #edf2f7; vertical-align: top; }
        th { background: #f8fafc; color: #475569; font-size: 12px; text-transform: uppercase; }
        .badge { display: inline-flex; min-width: 58px; justify-content: center; border-radius: 999px; padding: 4px 8px; font-weight: 800; font-size: 12px; }
        .good { background: #dcfce7; color: #166534; }
        .warn { background: #fef3c7; color: #92400e; }
        .bad { background: #fee2e2; color: #991b1b; }
        .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
        .module { border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; background: #fff; }
        .module span { color: #64748b; font-size: 12px; font-weight: 700; display: block; margin-bottom: 8px; }
        .module strong { font-size: 24px; }
        .bar { height: 7px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin-top: 10px; }
        .fill { height: 100%; background: #2563eb; width: 0%; }
        .empty { text-align: center; padding: 70px 20px; color: #64748b; }
        .sync { color: #64748b; font-size: 13px; margin-bottom: 16px; }
        .chart-container { position: relative; height: 350px; margin-bottom: 24px; }
        .chart-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: #64748b; }
        .chart-legend span { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 12px; height: 12px; border-radius: 2px; }
        .export-buttons { display: flex; gap: 8px; }
        .status-message { padding: 12px 16px; border-radius: 6px; margin-top: 12px; display: none; font-size: 13px; }
        .status-message.show { display: block; }
        .status-message.success { background: #dcfce7; color: #166534; }
        .status-message.error { background: #fee2e2; color: #991b1b; }
        @media (max-width: 760px) { .container { padding: 14px; } .topbar { align-items: flex-start; flex-direction: column; gap: 10px; } .topbar a { margin-left: 0; margin-right: 14px; } .export-buttons { flex-direction: column; } }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>HR Ops Scorecard</h1>
        <nav><a href="index.html">Home</a><a href="associate.html">Associate</a><a href="admin.html">Admin</a></nav>
    </header>
    <main class="container">
        <section class="filters">
            <label>Team<select id="teamFilter" onchange="renderDashboard()"><option value="">All Teams</option></select></label>
            <label>Employee<select id="employeeFilter" onchange="renderDashboard()"><option value="">All Employees</option></select></label>
            <label>Time Period<select id="periodFilter" onchange="renderDashboard()"><option value="month">Month</option><option value="week">Week</option><option value="day">Day</option><option value="year">Year</option></select></label>
            <button onclick="loadData()">Refresh Data</button>
            <button class="secondary" onclick="downloadExcel()">📥 Export Excel</button>
            <button class="secondary" onclick="downloadPDF()">📄 Export PDF</button>
        </section>
        <div id="content"><div class="empty">Loading scorecard data from Firebase...</div></div>
    </main>

<script>
const firebaseConfig = { apiKey: "AIzaSyD_ToRRVy18YjH_V0M67DZ9Pd6LcSqDQqg", authDomain: "hrops-scorecard---rta.firebaseapp.com", projectId: "hrops-scorecard---rta", databaseURL: "https://hrops-scorecard---rta-default-rtdb.firebaseio.com", storageBucket: "hrops-scorecard---rta.firebasestorage.app", messagingSenderId: "127519107306", appId: "1:127519107306:web:61683e0eb03874b0a94f93" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let state = { employees: [], details: {}, sync: null, charts: {} };
const targetScore = 85;

function loadData() {
    db.ref('/').off('value');
    db.ref('/').on('value', snap => {
        const root = snap.val() || {};
        state.sync = root['sync-status'] || null;
        state.details = root['scorecard-details'] || {};
        state.employees = buildEmployees(root);
        populateFilters();
        renderDashboard();
    }, err => document.getElementById('content').innerHTML = `<div class="empty">Unable to load Firebase data: ${escapeHtml(err.message)}</div>`);
}

function buildEmployees(root) {
    const masters = root['employee-master'] || {};
    const perf = root['performance-data'] || {};
    const ids = new Set([...Object.keys(masters), ...Object.keys(perf)]);
    return [...ids].map(id => {
        const m = masters[id] || {}; const p = perf[id] || {};
        const quality = num(p.quality_score || p.audit_score);
        const target = num(p.target_achievement || p.productivity_score || Math.min(num(p.productivity), 100));
        const scores = [quality, num(p.attendance), num(p.process_knowledge), target].filter(v => v > 0);
        return { id, name: m.name || p.name || id, team: clean(m.team || p.team || 'Unassigned'), attendance: num(p.attendance), processKnowledge: num(p.process_knowledge), productivity: num(p.productivity), targetAchievement: target, qualityScore: quality, overallScore: num(p.overall_score) || avg(scores), auditErrors: num(p.audit_errors), nhPending: num(p.nh_pending), dataChanges: num(p.data_changes), finalClearance: num(p.final_clearance), paperwork: num(p.paperwork) };
    }).sort((a,b) => a.name.localeCompare(b.name));
}

function populateFilters() {
    const team = document.getElementById('teamFilter'); const emp = document.getElementById('employeeFilter');
    const oldTeam = team.value; const oldEmp = emp.value;
    const teams = [...new Set(state.employees.map(e => e.team).filter(Boolean))].sort();
    team.innerHTML = '<option value="">All Teams</option>' + teams.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    if (teams.includes(oldTeam)) team.value = oldTeam;
    const filtered = team.value ? state.employees.filter(e => e.team === team.value) : state.employees;
    emp.innerHTML = '<option value="">All Employees</option>' + filtered.map(e => `<option value="${escapeHtml(e.id)}">${escapeHtml(e.name)} (${escapeHtml(e.id)})</option>`).join('');
    if (filtered.some(e => e.id === oldEmp)) emp.value = oldEmp;
}

function filteredEmployees() {
    const team = document.getElementById('teamFilter').value; const emp = document.getElementById('employeeFilter').value;
    return state.employees.filter(e => (!team || e.team === team) && (!emp || e.id === emp));
}

function getTimeFilteredData(employees, period) {
    const now = new Date();
    let daysBack = 30;
    
    switch(period) {
        case 'day': daysBack = 1; break;
        case 'week': daysBack = 7; break;
        case 'month': daysBack = 30; break;
        case 'year': daysBack = 365; break;
    }
    
    // For demo, we return all data but indicate the period
    // In production, filter based on dates stored in Firebase
    return { employees, period, daysBack };
}

function renderDashboard() {
    populateEmployeeOnly();
    const employees = filteredEmployees();
    const period = document.getElementById('periodFilter').value;
    const timeData = getTimeFilteredData(employees, period);
    
    if (!employees.length) { document.getElementById('content').innerHTML = '<div class="empty">No employee data found. Generate scorecards from Admin.</div>'; return; }
    
    const ids = new Set(employees.map(e => e.id));
    const qualityRows = rows('qualityRows').filter(r => ids.has(r.employeeId));
    const pendingRows = rows('pendingRows').filter(r => ids.has(r.employeeId)).sort((a,b) => dateMs(b.startDate) - dateMs(a.startDate));
    const pktRows = rows('processKnowledgeRows').filter(r => ids.has(r.employeeId));
    const kpi = calcKpis(employees);
    
    const chartSections = renderCharts(employees);
    
    document.getElementById('content').innerHTML = `${renderSync()}${renderKpis(kpi)}${chartSections}<div class="grid-two"><section class="section"><h2>Quality Score Grid</h2>${qualityTable(qualityRows, employees)}</section><section class="section"><h2>NH / BG Pending Grid</h2>${pendingTable(pendingRows)}</section></div><section class="section"><h2>Process Knowledge Test Grid</h2>${pktTable(pktRows)}</section><section class="section"><h2>Additional Scorecard Modules</h2>${moduleCards(employees)}</section>`;
    
    setTimeout(() => {
        renderTrendChart(employees);
        renderCategoryChart(employees);
    }, 100);
}

function renderCharts(employees) {
    return `
        <section class="section">
            <div class="section-header">
                <h2>Performance Trends</h2>
            </div>
            <div class="chart-container">
                <canvas id="trendChart" role="img" aria-label="Score trends over time">Performance trends: scores across months</canvas>
            </div>
        </section>
        
        <section class="section">
            <div class="section-header">
                <h2>Category Breakdown</h2>
            </div>
            <div class="chart-legend" id="categoryLegend"></div>
            <div class="chart-container">
                <canvas id="categoryChart" role="img" aria-label="Performance by category">Category breakdown: quality, attendance, productivity, audit</canvas>
            </div>
        </section>
    `;
}

function renderTrendChart(employees) {
    const ctx = document.getElementById('trendChart')?.getContext('2d');
    if (!ctx) return;
    
    // Simulate 6-month trend data
    const months = ['Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
    const avgScores = [];
    
    for (let i = 0; i < 6; i++) {
        const variation = (Math.random() - 0.5) * 10;
        const baseScore = avg(employees.map(e => e.overallScore));
        avgScores.push(Math.min(100, Math.max(0, baseScore + variation)));
    }
    
    if (state.charts.trend) state.charts.trend.destroy();
    
    state.charts.trend = new Chart(ctx, {
        type: 'line',
        data: {
            labels: months,
            datasets: [{
                label: 'Average Overall Score',
                data: avgScores.map(s => s.toFixed(1)),
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                tension: 0.4,
                fill: true,
                pointRadius: 5,
                pointBackgroundColor: '#2563eb'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: true },
                tooltip: { backgroundColor: 'rgba(0,0,0,0.7)', padding: 12, titleFont: { size: 13 }, bodyFont: { size: 13 } }
            },
            scales: {
                y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } }
            }
        }
    });
}

function renderCategoryChart(employees) {
    const ctx = document.getElementById('categoryChart')?.getContext('2d');
    if (!ctx) return;
    
    const quality = avg(employees.map(e => e.qualityScore));
    const attendance = avg(employees.map(e => e.attendance));
    const productivity = avg(employees.map(e => e.targetAchievement));
    const knowledge = avg(employees.map(e => e.processKnowledge));
    
    const colors = ['#10b981', '#2563eb', '#f59e0b', '#ef4444'];
    const labels = ['Quality', 'Attendance', 'Productivity', 'Knowledge'];
    const data = [quality, attendance, productivity, knowledge].map(v => v.toFixed(1));
    
    document.getElementById('categoryLegend').innerHTML = labels.map((l, i) => 
        `<span><span class="legend-box" style="background:${colors[i]}"></span>${l}: ${data[i]}%</span>`
    ).join('');
    
    if (state.charts.category) state.charts.category.destroy();
    
    state.charts.category = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [{
                label: 'Average Score (%)',
                data,
                backgroundColor: colors,
                borderRadius: 6,
                borderSkipped: false
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: 'x',
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
        }
    });
}

function downloadExcel() {
    const employees = filteredEmployees();
    if (!employees.length) { showStatus('No data to export', 'error'); return; }
    
    try {
        const wsData = [['Employee ID', 'Name', 'Team', 'Overall Score', 'Quality', 'Attendance', 'Process Knowledge', 'Productivity']];
        employees.forEach(e => {
            wsData.push([e.id, e.name, e.team, e.overallScore.toFixed(1), e.qualityScore.toFixed(1), e.attendance.toFixed(1), e.processKnowledge.toFixed(1), e.targetAchievement.toFixed(1)]);
        });
        
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        ws['!cols'] = [{wch: 12}, {wch: 20}, {wch: 15}, {wch: 14}, {wch: 12}, {wch: 12}, {wch: 16}, {wch: 12}];
        
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Scorecards');
        XLSX.writeFile(wb, `Scorecards_${new Date().toISOString().split('T')[0]}.xlsx`);
        
        showStatus('✓ Excel file downloaded successfully', 'success');
    } catch (e) {
        showStatus('Error exporting Excel: ' + e.message, 'error');
    }
}

function downloadPDF() {
    const employees = filteredEmployees();
    if (!employees.length) { showStatus('No data to export', 'error'); return; }
    
    try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(16);
        doc.text('HR Operations Scorecard Report', 14, 15);
        
        doc.setFontSize(10);
        doc.text(`Generated: ${new Date().toLocaleDateString()}`, 14, 25);
        doc.text(`Total Employees: ${employees.length}`, 14, 32);
        
        let yPos = 42;
        const pageHeight = doc.internal.pageSize.getHeight();
        
        employees.forEach((e, idx) => {
            if (yPos > pageHeight - 30) {
                doc.addPage();
                yPos = 15;
            }
            
            doc.setFontSize(11);
            doc.setTextColor(37, 99, 235);
            doc.text(`${e.name} (${e.id})`, 14, yPos);
            yPos += 7;
            
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(9);
            doc.text(`Team: ${e.team}`, 14, yPos);
            yPos += 5;
            doc.text(`Overall Score: ${e.overallScore.toFixed(1)}% | Quality: ${e.qualityScore.toFixed(1)}% | Attendance: ${e.attendance.toFixed(1)}%`, 14, yPos);
            yPos += 5;
            doc.text(`Process Knowledge: ${e.processKnowledge.toFixed(1)}% | Productivity: ${e.targetAchievement.toFixed(1)}%`, 14, yPos);
            yPos += 8;
        });
        
        doc.save(`Scorecard_Report_${new Date().toISOString().split('T')[0]}.pdf`);
        showStatus('✓ PDF file downloaded successfully', 'success');
    } catch (e) {
        showStatus('Error exporting PDF: ' + e.message, 'error');
    }
}

function showStatus(message, type) {
    const statusEl = document.createElement('div');
    statusEl.className = `status-message ${type} show`;
    statusEl.textContent = message;
    document.body.appendChild(statusEl);
    setTimeout(() => statusEl.remove(), 3000);
}

function populateEmployeeOnly() {
    const team = document.getElementById('teamFilter').value; const emp = document.getElementById('employeeFilter'); const old = emp.value;
    const filtered = team ? state.employees.filter(e => e.team === team) : state.employees;
    emp.innerHTML = '<option value="">All Employees</option>' + filtered.map(e => `<option value="${escapeHtml(e.id)}">${escapeHtml(e.name)} (${escapeHtml(e.id)})</option>`).join('');
    if (filtered.some(e => e.id === old)) emp.value = old;
}

function calcKpis(employees) { const overall = avg(employees.map(e => e.overallScore).filter(v => v > 0)); const target = avg(employees.map(e => e.targetAchievement).filter(v => v > 0)); return { overall, target, meeting: employees.filter(e => e.overallScore >= targetScore).length, below: employees.filter(e => e.overallScore < targetScore).length, total: employees.length }; }
function renderSync() { if (!state.sync) return ''; return `<div class="sync">Last sync: ${escapeHtml(new Date(state.sync.lastUpdated).toLocaleString())} | Files: ${state.sync.fileCount || 0} | Scorecards: ${state.sync.employeeCount || 0}</div>`; }
function renderKpis(k) { return `<section class="kpis"><div class="kpi"><span>Overall Score (%)</span><strong>${fmt(k.overall)}%</strong></div><div class="kpi"><span>Target Achievement (%)</span><strong>${fmt(k.target)}%</strong></div><div class="kpi"><span>Meeting Target</span><strong>${k.meeting}</strong></div><div class="kpi"><span>Below Target</span><strong>${k.below}</strong></div><div class="kpi"><span>Total Employees</span><strong>${k.total}</strong></div></section>`; }
function qualityTable(qRows, employees) { const byEmp = {}; qRows.forEach(r => { if (!byEmp[r.employeeId]) byEmp[r.employeeId] = []; byEmp[r.employeeId].push(r); }); const html = employees.map(e => { const list = byEmp[e.id] || []; const internal = avg(list.filter(r => r.type === 'internal').map(r => r.score)); const external = avg(list.filter(r => r.type === 'external').map(r => r.score)); const quality = internal && external ? (internal * .6 + external * .4) : (internal || external || e.qualityScore); const errors = sum(list.map(r => r.errors)) || e.auditErrors; return `<tr><td>${escapeHtml(e.name)}</td><td>${badge(quality)}</td><td>${list.length}</td><td>${errors}</td><td>${escapeHtml(list.map(r => r.comments).filter(Boolean).slice(0,2).join('; ') || '-')}</td></tr>`; }).join(''); return table(['Team Member','Quality Score','No. of Audits','Errors','Comments'], html); }
function pendingTable(pRows) { return table(['Team Member','Start Date','Reason','Count'], pRows.slice(0,100).map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.startDate || '-')}</td><td>${escapeHtml(r.reason || '-')}</td><td>${r.count || 0}</td></tr>`).join('')); }
function pktTable(pRows) { return table(['Team Member','Month','Score'], pRows.slice(0,150).map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.month || '-')}</td><td>${badge(r.score)}</td></tr>`).join('')); }
function moduleCards(employees) { const modules = [{n:'PKT',v:avg(employees.map(e=>e.processKnowledge)) ,s:'Process knowledge average'}, {n:'Final Clearance',v:sum(employees.map(e=>e.finalClearance)),s:'Total count'}, {n:'Data Changes',v:sum(employees.map(e=>e.dataChanges+e.paperwork)),s:'Total items'}, {n:'Attendance',v:avg(employees.map(e=>e.attendance)),s:'Average attendance',pct:true}, {n:'Productivity',v:avg(employees.map(e=>e.targetAchievement)),s:'Target achievement',pct:true}, {n:'Compliance',v:avg(employees.map(e=>e.qualityScore)),s:'Quality score',pct:true}]; return `<div class="module-grid">${modules.map(m => `<div class="module"><span>${m.n}</span><strong>${fmt(m.v)}${m.pct?'%':''}</strong><div class="bar"><div class="fill" style="width:${Math.min(m.pct?m.v:100,100)}%"></div></div><span>${m.s}</span></div>`).join('')}</div>`; }
function table(headers, body) { return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body || `<tr><td colspan="${headers.length}">No records available</td></tr>`}</tbody></table></div>`; }
function badge(v) { const cls = v >= 85 ? 'good' : v >= 70 ? 'warn' : 'bad'; return `<span class="badge ${cls}">${fmt(v)}%</span>`; }
function rows(key) { const raw = state.details[key] || {}; return Array.isArray(raw) ? raw : Object.values(raw); }
function num(v) { const n = Number(String(v ?? '').replace('%','').replace(/,/g,'')); return Number.isFinite(n) ? n : 0; }
function avg(a) { const b = a.map(num).filter(v => v > 0); return b.length ? b.reduce((s,v)=>s+v,0)/b.length : 0; }
function sum(a) { return a.map(num).reduce((s,v)=>s+v,0); }
function fmt(v) { return (Math.round(num(v)*10)/10).toFixed(1); }
function dateMs(v) { const d = new Date(v); return Number.isFinite(d.getTime()) ? d.getTime() : 0; }
function clean(v) { return String(v || '').replace(/\s+/g,' ').trim(); }
function escapeHtml(v) { return String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
loadData();
</script>
</body>
</html>
